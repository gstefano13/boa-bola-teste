    route();
  }),
  confirmar: el => run(async () => {
    const vou = el.dataset.vou === "1";
    ok(await sb.rpc("confirmar_presenca", { p: app.pelada.id, vou_: vou }));
    await carregar();
    const s = situacaoDe(app.user.id);
    if (vou && s === "confirmado") {
      state.votarIds = faltaVotar();
      state.votarIds.forEach(id => state.votosVistos.add(id));
      state.modal = state.votarIds.length ? "votar" : null;
      aviso(state.votarIds.length ? "Confirmado! Agora avalie quem já está na lista." : "Confirmado! Você é o primeiro da lista.");
    } else if (vou) state.modal = "espera";
    else { state.modal = null; aviso("Ok, você ficou fora dessa."); }
    route(true);
  }),
  abrirConfirmar: () => { state.modal = "confirmar"; renderModal(); },
  subirEspera: el => run(async () => {
    const sobe = el.dataset.sobe === "1";
    ok(await sb.rpc("presidente_subir", { p: app.pelada.id, jogador: el.dataset.jogador, sobe }));
    await carregarLista();
    route(true);
    aviso(sobe ? `${nomeDe(el.dataset.jogador)} subiu e está confirmado` : `${nomeDe(el.dataset.jogador)} saiu da lista de confirmados`);
  }),
  porNaLista: () => run(async () => {
    const id = (document.getElementById("porNaLista") || {}).value;
    if (!id) return;
    ok(await sb.rpc("presidente_subir", { p: app.pelada.id, jogador: id, sobe: true }));
    await atualizarVotacao();
    route(true);
    aviso(`${id === app.user.id ? "Você está" : `${nomeDe(id)} está`} na lista`);
  }),
  // toque no nome da lista: abre a votação começando por essa pessoa, depois quem ainda falta
  votarUm: el => {
    const id = el.dataset.jogador;
    const resto = naLista().filter(x => x !== app.user.id && x !== id);
    state.votarIds = [id, ...resto.filter(x => !notaMinha(x)), ...resto.filter(x => notaMinha(x))];
    state.votarIds.forEach(x => state.votosVistos.add(x));
    state.modal = "votar";
    renderModal();
  },
  abrirVotacao: () => {
    const outros = naLista().filter(id => id !== app.user.id);
    state.votarIds = [...outros.filter(id => !notaMinha(id)), ...outros.filter(id => notaMinha(id))];
    state.votarIds.forEach(id => state.votosVistos.add(id));
    state.modal = "votar";
    renderModal();
  },
  votarLista: el => run(async () => {
    const votado = el.dataset.jogador, nota = Number(el.dataset.nota);
    try { ok(await sb.rpc("votar_na_lista", { p: app.pelada.id, votado, nota_: nota })); }
    catch (e) { await atualizarVotacao(); renderModal(); throw e; }   // ex.: a pessoa saiu da lista; mostra a lista atual
    const pa = partidaDoJogo();
    // a partida do dia pode ter sido criada depois que o app abriu: aí busca de novo em vez de quebrar
    if (pa) app.meusVotos = app.meusVotos.filter(v => !(v.partida_id === pa.id && v.votado_id === votado)).concat({ partida_id: pa.id, votado_id: votado, nota });
    else await atualizarVotacao();
    renderModal();
  }),
  fecharModal: () => { state.modal = null; renderModal(); route(true); },
  abrirGuia: () => abrirGuia(),
  guiaPasso: el => { state.guiaPasso = Math.max(0, state.guiaPasso + Number(el.dataset.delta)); renderModal(); },
  nada: () => {},
  instalar: async () => {
    if (!pedidoInstalar) return;
    pedidoInstalar.prompt();
    const { outcome } = await pedidoInstalar.userChoice;
    pedidoInstalar = null;
    if (outcome === "accepted") { gravar("instalado", "1"); aviso("Anotou instalado!"); }
    route(true);
  },
  instalarDepois: () => { gravar("instalarDepois", String(Date.now() + 14 * 864e5)); route(true); },
  minhaPosicao: el => run(async () => {
    ok(await sb.rpc("definir_minha_posicao", { p: app.pelada.id, pos: el.dataset.valor }));
    app.membro.posicao = el.dataset.valor;
    aviso(`Posição salva: ${NOME_POS[el.dataset.valor][0]}`);
    renderModal();
    route(true);
  }),
  sortear: () => run(async () => {
    const times = sortearTimes(naLista(), QTD_TIMES);
    const linhas = times.flatMap((ids, i) => ids.map(jogador_id => ({ jogador_id, time: i + 1 })));
    ok(await sb.rpc("salvar_sorteio", { p: app.pelada.id, d: app.jogo.data, times: linhas }));
    state.troca = null;
    await carregarLista();
    aviso("Times sorteados e equilibrados!");
    route(true);
  }),
  trocarJogador: el => run(async () => {
    const id = el.dataset.id;
    if (!state.troca || state.troca === id) { state.troca = state.troca === id ? null : id; return route(true); }
    const a = app.timesJogo.find(t => t.jogador_id === state.troca), b = app.timesJogo.find(t => t.jogador_id === id);
    state.troca = null;
    if (a.time === b.time) { state.troca = id; return route(true); }
    const linha = (jid, time) => sb.from("times_do_jogo").update({ time }).eq("pelada_id", app.pelada.id).eq("data", app.jogo.data).eq("jogador_id", jid);
    ok(await linha(a.jogador_id, b.time)); ok(await linha(b.jogador_id, a.time));
    await carregarLista();
    aviso(`${nomeDe(a.jogador_id)} ⇄ ${nomeDe(b.jogador_id)}`);
    route(true);
  }),
  golConfronto: el => run(async () => {
    const c = app.confrontos.find(x => x.id === el.dataset.id), campo = el.dataset.lado === "a" ? "gols_a" : "gols_b";
    const valor = Math.max(0, c[campo] + Number(el.dataset.d));
    ok(await sb.from("confrontos").update({ [campo]: valor }).eq("id", c.id));
    c[campo] = valor;
    route(true);
  }),
  encerrarConfronto: el => run(async () => {
    ok(await sb.from("confrontos").update({ status: "encerrado" }).eq("id", el.dataset.id));
    await carregarLista();
    route(true);
  }),

  // registrar pelada: data → separar times → registrar partidas
  registrarPelada: () => { state.pos = { passo: "data" }; irProRegistro(); },
  verPartidas: () => { state.verPartidas = !state.verPartidas; route(true); },
  posCorrigir: el => run(() => abrirPos(el.dataset.data)),
  posContinuar: () => run(() => abrirPos(rascunhoPos().data)),
  posDescartar: () => { state.pos = null; guardarPos(); route(true); aviso("Rascunho descartado"); },
  // põe ou tira do time que está aberto; com 6 o time trava e a tela pula pro próximo que falta
  posTime: el => {
    const P = state.pos, id = el.dataset.id, n = Number(el.dataset.time);
    if (P.times[id] === n) delete P.times[id];
    else {
      if (elencoPos(n).length >= TAM_TIME_POS) return aviso(`O ${nomeTimePos(n)} já tem ${TAM_TIME_POS}. Tire alguém antes.`);
      P.times[id] = n;
      if (elencoPos(n).length >= TAM_TIME_POS) {
        const prox = POS_TIMES.find(t => elencoPos(t).length < TAM_TIME_POS);
        if (prox) { P.timeAtual = prox; aviso(`${nomeTimePos(n)} completo! Agora o ${nomeTimePos(prox)}.`); }
        else aviso("Os 4 times estão completos!");
      }
    }
    if (!timesProntos()) P.timesOk = false;
    guardarPos(); route(true);
  },
  posConfirmarTimes: () => {
    if (!timesProntos()) return aviso("Coloque pelo menos 1 jogador em cada time.");
    state.pos.timesOk = true;
    guardarPos(); route(true);
    const e = document.getElementById("etapa2");
    if (e) e.scrollIntoView({ behavior: "smooth", block: "center" });
    aviso("Times confirmados! Etapa 2 liberada.");
  },
  posTimeAtual: el => { state.pos.timeAtual = Number(el.dataset.time); guardarPos(); route(true); },
  posModoTimes: el => { state.pos.modoTimes = el.dataset.valor; guardarPos(); route(true); },
  posSortear: () => {
    // na ordem de quem confirmou primeiro, até 4 times de 6
    const P = state.pos, max = POS_TIMES.length * TAM_TIME_POS;
    const ordem = [...new Set([...P.confirmados, ...P.extras, ...candidatosPos()])].filter(id => candidatosPos().includes(id));
    if (ordem.length < POS_TIMES.length) return aviso("Precisa de pelo menos 4 jogadores pra sortear.");
    P.times = {}; P.timesOk = false;
    sortearTimes(ordem.slice(0, max), POS_TIMES.length).forEach((grupo, i) => grupo.forEach(id => { P.times[id] = i + 1; }));
    guardarPos(); route(true);
    aviso(ordem.length > max ? `Times sorteados com os ${max} primeiros confirmados.` : "Times sorteados e equilibrados!");
  },
  posExtra: () => {
    const id = (document.getElementById("posExtra") || {}).value;
    if (!id) return;
    state.pos.extras.push(id);
    guardarPos(); route(true);
  },
  posTodos: () => { state.pos.todos = true; guardarPos(); route(true); },
  posCriarTimes: () => {
    const vazio = POS_TIMES.find(n => !elencoPos(n).length);
    if (vazio) return aviso(`O ${nomeTimePos(vazio)} está sem jogador.`);
    const fora = podarJogos(), primeira = !state.pos.jogos.length;
    state.pos.passo = "jogos";
    guardarPos(); route();
    aviso(fora ? `Times salvos. ${plural(fora, "lance saiu", "lances saíram")} porque o jogador mudou de time.` : primeira ? "Times prontos! Agora registre as partidas." : "Times salvos");
  },
  posPasso: el => {
    if (el.dataset.passo === "jogos") {
      if (state.pos.passo === "jogos") return;
      return state.pos.timesOk ? ACOES.posCriarTimes() : aviso("Confirme os times primeiro.");
    }
    state.pos.passo = "times";
    guardarPos(); route();
  },
  posAbrir: el => {
    const i = Number(el.dataset.i);
    state.pos.aberto = state.pos.aberto === i ? null : i;
    guardarPos(); route(true); irProJogo();
  },
  posFechar: () => { state.pos.aberto = null; guardarPos(); route(true); },
  posApagarJogo: el => {
    state.pos.jogos.splice(Number(el.dataset.i), 1);
    state.pos.aberto = null;
    guardarPos(); route(true);
    aviso("Partida excluída");
  },
  // −/+ de uma estatística de um jogador na partida aberta
  posStat: el => {
    const j = jogoAberto(), id = el.dataset.id, k = el.dataset.k, mais = el.dataset.d === "1";
    if (k === "G") {
      if (mais) j.gols.push({ autor: id, assist: null });
      else {   // tira primeiro um gol sem assistência, pra não apagar a assistência de ninguém à toa
        const meus = j.gols.filter(g => g.autor === id), g = meus.find(x => !x.assist) || meus[meus.length - 1];
        if (g) { j.gols.splice(j.gols.indexOf(g), 1); if (g.assist) aviso(`A assistência de ${nomeDe(g.assist)} nesse gol saiu junto.`); }
      }
    } else if (k === "A") {
      if (mais) {
        const g = j.gols.find(x => !x.assist && x.autor !== id && timeDe(x.autor) === timeDe(id));
        if (!g) return aviso("Marque primeiro o gol: a assistência vai num gol de alguém do mesmo time.");
        g.assist = id;
      } else { const g = [...j.gols].reverse().find(x => x.assist === id); if (g) g.assist = null; }
    } else {
      const l = j.lances.find(x => x.jogador === id && x.metrica === k);
      if (mais) { if (l) l.qtd++; else j.lances.push({ jogador: id, metrica: k, qtd: 1 }); }
      else if (l && --l.qtd < 1) j.lances.splice(j.lances.indexOf(l), 1);
    }
    guardarPos(); route(true);
  },
  posConferir: () => {
    if (!state.pos.jogos.length) return aviso("Registre pelo menos uma partida.");
    state.modal = "resumoPos";
    renderModal();
  },
  posSalvar: el => run(async () => {
    const P = state.pos;
    el.disabled = true;
    let r;
    try {
      r = ok(await sb.rpc("salvar_pos_pelada", { p: app.pelada.id, d: P.data,
        times: Object.entries(P.times).map(([jogador_id, time]) => ({ jogador_id, time })),
        jogos: P.jogos.map(j => ({ a: j.a, b: j.b, gols: j.gols.map(g => ({ autor: g.autor, assist: g.assist || null })), lances: j.lances })) }));
    } catch (e) { el.disabled = false; throw e; }
    state.pos = null; guardarPos();
    state.modal = null; renderModal();
    await carregar();
    if (location.hash === "#pelada") route(); else location.hash = "pelada";
    aviso(`Pelada salva e rankings atualizados.${r.cartola === "encerrada" ? ` Rodada ${r.rodada} do Cartola encerrada.`
      : r.cartola === "recalculada" ? ` Rodada ${r.rodada} do Cartola recalculada.` : ""}`);
  }),
  metodo: el => run(async () => { if (app.pelada.metodo !== el.dataset.valor) { await salvarPelada({ metodo: el.dataset.valor }); route(); } }),
  janela: el => run(async () => { await salvarPelada({ janela_semanas: Number(el.dataset.valor) }); route(); }),
  qtdPotes: el => run(async () => {
    const n = Math.min(Math.max(app.pelada.qtd_potes + Number(el.dataset.delta), 2), 10);
    if (n !== app.pelada.qtd_potes) { await salvarPelada({ qtd_potes: n }); route(); }
  }),
  ligarMetrica: el => run(async () => {
    const metricas = app.pelada.metricas.map((m, i) => i === Number(el.dataset.i) ? { ...m, ativo: !m.ativo } : m);
    state.editMetrica = null;
    await salvarPelada({ metricas }); route();
  }),
  editMetrica: el => { const i = Number(el.dataset.i); state.editMetrica = state.editMetrica === i ? null : i; route(); },
  addMetrica: () => { state.editMetrica = "nova"; route(); },
  fecharMetrica: () => { state.editMetrica = null; route(); },
  removerMetrica: el => run(async () => {
    const metricas = app.pelada.metricas.filter((m, i) => i !== Number(el.dataset.i));
    state.editMetrica = null;
    await salvarPelada({ metricas }); route();
  }),
  addJogador: () => { state.addJogador = !state.addJogador; renderCardJogadores(); },
  filtroJog: el => { state.filtroJog = el.dataset.valor; renderCardJogadores(); },
  verTodosJog: () => { state.verTodosJog = !state.verTodosJog; renderListaJog(); },
  editJog: el => { state.editando = state.editando === el.dataset.jogador ? null : el.dataset.jogador; renderListaJog(); },
  tipo: el => run(async () => { await mudarMembro(el.dataset.jogador, { tipo: el.dataset.valor }); }),
  papel: el => run(async () => { await mudarMembro(el.dataset.jogador, { papel: el.dataset.valor }); }),
  poteManual: el => run(async () => {
    const m = membroDe(el.dataset.jogador), N = app.pelada.qtd_potes;
    const atual = m.pote_manual || Math.ceil(N / 2);
    await mudarMembro(m.jogador_id, { pote_manual: Math.min(Math.max(atual + Number(el.dataset.delta), 1), N) });
  }),
  removerJog: el => run(async () => {
    ok(await sb.from("membros").delete().eq("pelada_id", app.pelada.id).eq("jogador_id", el.dataset.jogador));
    state.editando = null;
    aviso("Jogador removido da pelada");
    await recarregar();
  }),
  novaPelada: () => { state.novaPelada = !state.novaPelada; renderPeladasDev(); inserirPatrocinio(); },
  filtro: el => { state.filtro = el.dataset.valor; renderPeladasDev(); inserirPatrocinio(); },
  verTodas: () => { state.verTodas = !state.verTodas; renderListaPeladas(); },

  // cartola: jogador
  cartComprar: el => run(async () => {
    ok(await sb.rpc("cartola_comprar", { p: app.pelada.id, atleta: el.dataset.id }));
    await carregarCartola(); route(true);
    aviso(`${nomeDe(el.dataset.id)} entrou no seu time`);
  }),
  cartVender: el => run(async () => {
    ok(await sb.rpc("cartola_vender", { p: app.pelada.id, atleta: el.dataset.id }));
    if (state.capitao === el.dataset.id) state.capitao = null;
    await carregarCartola(); route(true);
    aviso(`${nomeDe(el.dataset.id)} vendido`);
  }),
  cartCapitao: el => { state.capitao = el.dataset.id; route(true); },
  cartSalvar: () => run(async () => {
    const atual = (meuEscalado().find(e => e.capitao) || {}).atleta_id || null;
    if (state.capitao && state.capitao !== atual) {
      ok(await sb.rpc("cartola_capitao", { p: app.pelada.id, atleta: state.capitao }));
      await carregarCartola();
    }
    route(true);
    aviso(meuEscalado().length < TAM_TIME ? `Time salvo. ${faltamNoTime(meuEscalado())}.` : "Time salvo!");
  }),
  cartVaga: el => { state.mercPos = el.dataset.pos; state.mercTodos = false; location.hash = "mercado"; },
  cartRenomear: () => { state.renomear = !state.renomear; route(true); },
  cartEditarTime: () => { state.editarTime = !state.editarTime; state.formTime = null; route(true); },
  timeOpcao: el => { state.formTime[el.dataset.campo] = el.dataset.valor; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); atualizarPreviewTime(); },
  timeCor: el => { state.formTime[el.dataset.campo] = el.dataset.valor; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); atualizarPreviewTime(); },
  mercPos: el => { state.mercPos = el.dataset.valor; route(true); },
  mercTodos: () => { state.mercTodos = !state.mercTodos; renderListaMerc(); },
  cartFaq: el => { const i = Number(el.dataset.i); state.faq = state.faq === i ? null : i; route(true); },

  // cartola: presidente e dev
  cartAtivo: () => run(async () => { await salvarPelada({ cartola_ativo: !app.pelada.cartola_ativo }); await carregarCartola(); route(true); }),
  cartAbrir: () => run(async () => {
    const r = ok(await sb.rpc("cartola_abrir_rodada", { p: app.pelada.id }));
    await carregarCartola(); route(true);
    aviso(`Rodada ${r.numero} aberta. O mercado abre à 0h do dia da pelada.`);
  }),
  cartScoutMenos: el => run(async () => {
    const r = rodadaAberta(), q = Number(el.dataset.qtd);
    const alvo = sb.from("cartola_scouts");
    ok(q > 1
      ? await alvo.update({ qtd: q - 1 }).eq("rodada_id", r.id).eq("atleta_id", el.dataset.atleta).eq("codigo", el.dataset.codigo)
      : await alvo.delete().eq("rodada_id", r.id).eq("atleta_id", el.dataset.atleta).eq("codigo", el.dataset.codigo));
    await carregarCartola(); route(true);
  }),
  cartScoutLiga: el => run(async () => {
    const off = new Set(app.pelada.cartola_scouts_off || []);
    off.has(el.dataset.cod) ? off.delete(el.dataset.cod) : off.add(el.dataset.cod);
    if (state.editScout === el.dataset.cod) state.editScout = null;
    await salvarPelada({ cartola_scouts_off: [...off] }); route(true);
  }),
  cartPreset: el => run(async () => {
    const off = el.dataset.valor === "simples" ? GRUPOS_SCOUT.flatMap(g => g[1]).filter(c => !SCOUTS_SIMPLES.includes(c)) : [];
    state.editScout = null;
    await salvarPelada({ cartola_scouts_off: off }); route(true);
  }),
  cartEditScout: el => { state.editScout = state.editScout === el.dataset.cod ? null : el.dataset.cod; route(true); },
  cartPontoPadrao: el => run(async () => {
    const troca = { ...(app.pelada.cartola_pontos || {}) };
    delete troca[el.dataset.cod];
    state.editScout = null;
    await salvarPelada({ cartola_pontos: troca }); route(true);
  }),
  cartAjustes: el => { const d = el.parentElement; d.open = !d.open; state.ajustesAbertos = d.open; },
  cartEncerrar: () => { state.confirmEncerrar = true; route(true); },
  cartEncerrarNao: () => { state.confirmEncerrar = false; route(true); },
  cartEncerrarSim: () => run(async () => {
    const n = rodadaAberta().numero;
    ok(await sb.rpc("cartola_encerrar_rodada", { p: app.pelada.id }));
    state.confirmEncerrar = false;
    await carregar(); route(true);   // os preços mudaram nos membros
    aviso(`Rodada ${n} encerrada: pontos somados e preços atualizados.`);
  }),
  posicao: el => run(async () => { await mudarMembro(el.dataset.jogador, { posicao: el.dataset.valor }); }),
  precoCartola: el => run(async () => {
    const m = membroDe(el.dataset.jogador);
    await mudarMembro(m.jogador_id, { preco: Math.max(1, Number(m.preco) + Number(el.dataset.delta)) });
  })
};

async function mudarMembro(jogador, campos){
  ok(await sb.from("membros").update(campos).eq("pelada_id", app.pelada.id).eq("jogador_id", jogador));
  Object.assign(membroDe(jogador), campos);
  if (jogador === app.user.id && campos.papel && !app.modoDev) return recarregar();
  renderListaJog();
}

const MUDANCAS = {
  peso: el => run(async () => { await salvarPelada({ peso_votacao: Number(el.value) }); }),
  mercOrdem: el => { state.mercOrdem = el.value; renderListaMerc(); },
  pontRodada: el => { state.pontRodada = el.value; route(true); },
  cartPartida: el => run(async () => {
    ok(await sb.rpc("cartola_vincular_partida", { rodada: rodadaAberta().id, partida: el.value || null }));
    await carregarCartola(); route(true);
    aviso("Partida da rodada definida");
  }),
  cartEsquema: el => run(async () => {
    try { ok(await sb.rpc("cartola_esquema", { p: app.pelada.id, esquema_: el.value })); }
    finally { await carregarCartola(); route(true); }
    aviso(`Formação ${el.value}`);
  }),
  cartDia: el => run(async () => { await salvarPelada({ cartola_dia: Number(el.value) }); route(true); }),
  cartHora: el => run(async () => { await salvarPelada({ cartola_hora: Number(el.value) }); route(true); }),
  // logo do patrocinador: diminui pra no máximo 400px, sobe pro Storage e já salva no box
  logoArquivo: el => run(async () => {
    const arq = el.files[0];
    el.value = "";
    if (!arq) return;
    aviso("Enviando logo…");
    const img = await createImageBitmap(arq);
    const k = Math.min(1, 400 / Math.max(img.width, img.height));
    const c = Object.assign(document.createElement("canvas"), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/webp", .9));
    const caminho = `logo-${Date.now()}.webp`;
    ok(await sb.storage.from("patrocinio").upload(caminho, blob, { contentType: "image/webp" }));
    const logo = sb.storage.from("patrocinio").getPublicUrl(caminho).data.publicUrl;
    const patrocinio = { ...app.patrocinio, logo };
    ok(await sb.from("config").update({ patrocinio }).eq("id", 1));
    app.patrocinio = patrocinio;
    const campo = document.querySelector('[data-form="patrocinio"] [name="logo"]');
    if (campo) campo.value = logo;
    document.getElementById("logoPrevia").innerHTML = `<img src="${esc(logo)}" alt="">`;
    document.querySelectorAll(".sponsor .logo").forEach(x => x.innerHTML = `<img src="${esc(logo)}" alt="">`);
    aviso("Logo salva");
  })
};

const INPUTS = {
  busca: el => { state.busca = el.value; renderListaPeladas(); },
  buscaJog: el => { state.buscaJog = el.value; renderListaJog(); },
  buscaUsu: el => { state.buscaUsu = el.value; renderListaUsu(); },
  mercBusca: el => { state.mercBusca = el.value; renderListaMerc(); },
  timeNome: el => { state.formTime.nome = el.value; atualizarPreviewTime(); },
  timeSigla: el => { state.formTime.sigla = el.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3); atualizarPreviewTime(); },
  pesoAoVivo: el => { document.getElementById("pesoLegenda").innerHTML = `<b>Votação ${el.value}%</b><span>Desempenho ${100 - el.value}%</span>`; }
};

async function comBotao(f, fn){
  const msg = document.getElementById("loginMsg");
  const b = f.querySelector("button:not([type=button])");
  b.disabled = true;
  if (msg) { msg.className = "msg"; msg.textContent = ""; }
  try { await fn(msg); }
  catch (e) { console.error(e); if (msg) { msg.className = "msg err"; msg.textContent = traduz(e); } else aviso(traduz(e)); }
  b.disabled = false;
}

const FORMS = {
  codigo: (f, d) => comBotao(f, async msg => {
    const codigo = d.get("codigo").trim().toUpperCase();
    state.loginEmail = d.get("email").trim();
    const nome = ok(await sb.rpc("pelada_por_codigo", { codigo, email: state.loginEmail }));
    if (!nome) throw new Error("Código de convite inválido");
    gravar("convite", codigo);
    state.loginPelada = nome;
    state.login = "cadastro";
    renderLogin();
  }),
  cadastro: (f, d) => comBotao(f, async msg => {
    const r = await sb.auth.signUp({ email: state.loginEmail, password: d.get("senha"), options: {
      data: { nome: d.get("nome").trim(), apelido: d.get("apelido").trim() },
      emailRedirectTo: location.origin + location.pathname
    } });
    if (r.error && r.error.message === "User already registered") {
      state.login = "senha";
      renderLogin();
      document.getElementById("loginMsg").textContent = "Esse e-mail já tem conta. Digite sua senha.";
      return;
    }
    const dados = ok(r);
    if (!dados.session) msg.textContent = "Conta criada! Abra o link que mandamos pro seu e-mail e depois entre com sua senha.";
  }),
  senha: (f, d) => comBotao(f, async () => {
    state.loginEmail = d.get("email").trim();
    ok(await sb.auth.signInWithPassword({ email: state.loginEmail, password: d.get("senha") }));
  }),
  entrarCodigo: (f, d) => run(async () => {
    const id = ok(await sb.rpc("entrar_na_pelada", { codigo: d.get("codigo").trim().toUpperCase() }));
    if (!id) return ACOES.painel();   // código do dev
    await carregarPeladas();
    location.hash = "inicio";
    await abrirPelada(id);
  }),
  criarPelada: (f, d) => run(async () => {
    const nova = ok(await sb.from("peladas").insert({
      nome: d.get("nome").trim(), dia_semana: d.get("dia").trim() || null,
      horario: d.get("horario").trim() || null, local: d.get("local").trim() || null
    }).select("*").single());
    const presidente = d.get("presidente").trim();
    if (presidente) {
      const r = await sb.rpc("adicionar_por_email", { p: nova.id, email_: presidente, tipo_: "mensalista", papel_: "presidente" });
      if (r.error) aviso(`Pelada criada, mas o presidente não foi adicionado: ${traduz(r.error)}`);
    }
    state.novaPelada = false;
    await carregarTodas();
    location.hash = "pelada";
    await abrirPelada(nova.id);
  }),
  dados: (f, d) => run(async () => {
    const campos = { nome: d.get("nome").trim(), dia_semana: d.get("dia").trim() || null,
      horario: d.get("horario").trim() || null, local: d.get("local").trim() || null, vagas: d.get("vagas") ? Number(d.get("vagas")) : null };
    if (app.modoDev) campos.status = d.get("status");
    await salvarPelada(campos);
    await carregarLista();
    route();
  }),
  metrica: (f, d) => run(async () => {
    const i = f.dataset.i, peso = Number(d.get("peso"));
    let metricas;
    if (i === "nova") {
      const nome = d.get("nome").trim();
      const base = nome.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "metrica";
      let chave = base, n = 2;
      while (app.pelada.metricas.some(m => m.chave === chave)) chave = `${base}_${n++}`;
      metricas = [...app.pelada.metricas, { chave, nome, peso, ativo: true, tipo: "manual" }];
    } else {
      metricas = app.pelada.metricas.map((m, k) => k === Number(i)
        ? { ...m, peso, ...(m.tipo === "manual" ? { nome: d.get("nome").trim() } : {}) } : m);
    }
    state.editMetrica = null;
    await salvarPelada({ metricas });
    route();
  }),
  addJogador: (f, d) => run(async () => {
    const r = ok(await sb.rpc("adicionar_jogador", { p: app.pelada.id, nome_: d.get("nome").trim(), email_: d.get("email").trim() || null, tipo_: d.get("tipo"), papel_: d.get("papel") }));
    state.addJogador = false;
    aviso(r === "conta" ? "Jogador adicionado!" : "Perfil criado, aguardando cadastro");
    await recarregar();
  }),
  emailPendente: (f, d) => run(async () => {
    const r = ok(await sb.rpc("definir_email", { jogador: f.dataset.jogador, email_: d.get("email").trim() }));
    if (r === "vinculado") { state.editando = null; aviso("Essa pessoa já tinha conta: perfil ligado!"); }
    else aviso("E-mail salvo. Liga assim que a pessoa criar a conta.");
    await recarregar();
  }),
  confronto: (f, d) => run(async () => {
    const a = Number(d.get("a")), b = Number(d.get("b"));
    if (a === b) return aviso("Escolha dois times diferentes.");
    ok(await sb.rpc("colocar_em_campo", { p: app.pelada.id, d: app.jogo.data, a, b }));
    await carregarLista();
    aviso(`Em campo: ${nomeTime(a)} x ${nomeTime(b)}`);
    route(true);
  }),
  posData: (f, d) => run(() => abrirPos(d.get("data"))),
  posJogo: (f, d) => {
    const a = Number(d.get("a")), b = Number(d.get("b"));
    if (a === b) return aviso("Escolha dois times diferentes.");
    state.pos.jogos.push({ a, b, gols: [], lances: [] });
    state.pos.aberto = state.pos.jogos.length - 1;
    guardarPos(); route(true); irProJogo();
  },
  cartNome: (f, d) => run(async () => {
    ok(await sb.rpc("cartola_renomear", { p: app.pelada.id, nome_: d.get("nome") }));
    state.renomear = false;
    await carregarCartola(); route(true);
    aviso("Nome do time salvo");
  }),
  cartScout: (f, d) => run(async () => {
    const r = rodadaAberta(), atleta = d.get("atleta"), codigo = d.get("codigo"), qtd = Math.max(1, Number(d.get("qtd")) || 1);
    const existe = cart().scouts.find(s => s.rodada_id === r.id && s.atleta_id === atleta && s.codigo === codigo);
    ok(await sb.from("cartola_scouts").upsert({ rodada_id: r.id, pelada_id: app.pelada.id, atleta_id: atleta, codigo, qtd: (existe ? existe.qtd : 0) + qtd },
      { onConflict: "rodada_id,atleta_id,codigo" }));
    await carregarCartola(); route(true);
    aviso(`${codigo} ×${qtd} para ${nomeDe(atleta)}`);
  }),
  cartTime: (f, d) => run(async () => {
    const t = state.formTime;
    const sigla = (d.get("sigla") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3);
    if (!sigla) throw new Error("Coloque uma sigla de 1 a 3 letras");
    ok(await sb.rpc("cartola_personalizar", { p: app.pelada.id, nome_: d.get("nome").trim(),
      escudo_: { forma: t.forma, padrao: t.padrao, cor1: t.cor1, cor2: t.cor2, sigla } }));
    const novo = !cart().meuTime.escudo;
    state.editarTime = false; state.formTime = null;
    await carregarCartola(); route(true);
    aviso(novo ? "Time criado! Agora escale seus jogadores." : "Time salvo");
  }),
  ligaNome: (f, d) => run(async () => {
    await salvarPelada({ cartola_liga_nome: d.get("nome").trim() || null });
    route(true);
  }),
  cartPonto: (f, d) => run(async () => {
    const cod = f.dataset.cod, valor = Math.round(Number(d.get("pontos")) * 10) / 10;
    const padrao = Number((cart().regras.find(r => r.codigo === cod) || {}).pontos);
    const troca = { ...(app.pelada.cartola_pontos || {}) };
    if (valor === padrao) delete troca[cod]; else troca[cod] = valor;
    state.editScout = null;
    await salvarPelada({ cartola_pontos: troca }); route(true);
  }),
  patrocinio: (f, d) => run(async () => {
    const patrocinio = { nome: d.get("nome").trim(), texto: d.get("texto").trim(), url: d.get("url").trim(), logo: d.get("logo").trim() };
    ok(await sb.from("config").update({ patrocinio }).eq("id", 1));
    app.patrocinio = patrocinio;
    aviso("Patrocinador salvo");
    route();
  })
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  // menu do perfil aberto: qualquer toque fora do nome fecha (inclusive escolher uma opção dele)
  if (state.menuPerfil && (!el || el.id !== "meChip")) { state.menuPerfil = false; renderMenuPerfil(); }
  if (el && ACOES[el.dataset.act]) { e.preventDefault(); ACOES[el.dataset.act](el); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.menuPerfil) { state.menuPerfil = false; renderMenuPerfil(); } });
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]");
  if (el && MUDANCAS[el.dataset.change]) MUDANCAS[el.dataset.change](el);
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-input]");
  if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el);
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](f, new FormData(f)); }
});

/* ===================== INÍCIO DA SESSÃO ===================== */
if (location.hash.startsWith("#convite=")) {
  gravar("convite", decodeURIComponent(location.hash.slice(9)).trim().toUpperCase());
  history.replaceState(null, "", location.pathname + location.search);
}
sb.auth.onAuthStateChange((evento, session) => {
  // fora do callback: o supabase-js não deixa chamar o banco direto aqui dentro
  setTimeout(() => {
    if (session && (!app.user || app.user.id !== session.user.id)) entrar(session.user);
    else if (!session && (app.user || evento === "INITIAL_SESSION")) {
      Object.assign(app, vazio());
      state.login = ler("convite") ? "codigo" : ler("email") ? "senha" : state.login;
      if (!state.loginEmail) state.loginEmail = ler("email") || "";
      route();
    }
  }, 0);
});
</script>
