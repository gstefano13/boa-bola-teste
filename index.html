<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anotou</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F4F4F4">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anotou">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F4F4F4; --card:#FFFFFF; --ink:#0E0E0E; --ink-2:#5C5C5C; --ink-3:#8C8C8C;
  --line:#E6E6E6; --soft:#F6F6F6; --accent:#B5F23D; --accent-ink:#4E7A0C; --lime:#B5F23D; --lime-soft:#E9FBC5; --lime-tint:#F4FDE2;
  --mono:'Geist Mono',ui-monospace,monospace;
  --r-xl:16px; --r-lg:12px; --r-md:12px; --r-sm:10px;
  --shadow:0 1px 0 rgba(0,0,0,.03), 0 8px 24px -12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
@supports(overflow:clip){html{overflow-x:clip}}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding-bottom:calc(110px + env(safe-area-inset-bottom));overflow-x:hidden}
img,video{max-width:100%}
.h2,.title-xl,.note,.hero h1,.hero .sub,.empty{overflow-wrap:anywhere}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px}
.brand{font-weight:600;font-size:25px;letter-spacing:-.04em;display:flex;align-items:center;gap:6px;line-height:1}
.brand svg{width:24px;height:24px;flex:none;position:relative;top:.12em} /* centro na altura das minúsculas */
.me-chip{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;font-weight:500;box-shadow:var(--shadow);color:inherit;text-decoration:none}
.me-chip:empty{display:none}
.me-wrap{position:relative}
.faixa-teste{position:sticky;top:0;z-index:50;background:#F59E0B;color:#0E0E0E;text-align:center;font-size:12px;font-weight:600;padding:5px 12px;letter-spacing:.02em}
.menu-perfil{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:35;min-width:220px;max-width:calc(100vw - 32px);background:var(--card);border-radius:16px;padding:6px;box-shadow:0 14px 34px -12px rgba(0,0,0,.35);animation:sobe .18s ease both}
.menu-perfil.on{display:block}
.menu-perfil .quem{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;min-width:0}
.menu-perfil .quem b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-perfil .quem span{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-perfil button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink)}
.menu-perfil button:hover{background:var(--soft)}
.menu-perfil button.sair{color:#B42318}
.av{width:32px;height:32px;border-radius:50%;background:var(--lime-soft);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.off{background:var(--soft);color:var(--ink-3)}

/* grid */
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.grid.solo{max-width:420px;margin:0 auto}
@media(min-width:900px){
  .grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
  .grid.solo{grid-template-columns:minmax(0,1fr)}
  .grid.solo.wide{max-width:640px}
  .span2{grid-column:1/-1}
}

/* cards */
.card{background:var(--card);border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.h2{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-top:4px}
.title-xl{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-top:8px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}

/* hero */
.hero{background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:24px 22px 20px;position:relative;overflow:hidden;min-height:340px;display:flex;flex-direction:column}
.hero::before{content:"";position:absolute;inset:auto -30% -55% auto;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(181,242,61,.55),rgba(181,242,61,0) 65%);pointer-events:none}
.hero .eyebrow{color:#A9A9A9}
.hero .check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#D6D6D6;position:relative}
.hero .check a{color:#D6D6D6;text-decoration:none}
.hero h1{font-size:clamp(30px,10.5vw,40px);line-height:1.02;font-weight:700;letter-spacing:-.045em;margin:14px 0 6px;position:relative}
.hero h1.sm{font-size:clamp(26px,8.5vw,32px);margin-top:12px}
.hero .sub{color:#B5B5B5;font-size:14px;position:relative}
.pote-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:10px 14px;margin:auto 0 22px;position:relative}
.pote-num{font-family:var(--mono);font-size:clamp(56px,22vw,96px);line-height:.82;font-weight:400;letter-spacing:-.09em}
.pote-label{font-size:13px;color:#A9A9A9;margin:28px 0 10px;position:relative}
.pote-meta{padding-bottom:6px;flex:1 1 110px;min-width:0}
.pote-meta .pill{white-space:normal}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:12.5px;font-weight:500;padding:5px 10px;white-space:nowrap}
.pill.lime{background:var(--lime);color:#0E0E0E}
.pill.ghost{background:rgba(255,255,255,.1);color:#E9E9E9}
.pill.soft{background:var(--soft);border:1px solid var(--line)}
.pill.off{background:var(--soft);border:1px solid var(--line);color:var(--ink-3)}
button.pill{font:inherit;font-size:12.5px;font-weight:500;border:0;cursor:pointer;color:var(--ink)}
.pote-meta p{font-size:13px;color:#A9A9A9;margin-top:8px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.12);padding-top:14px;position:relative}
.hero-stats div{padding-right:10px;min-width:0}
.hero-stats div+div{border-left:1px solid rgba(255,255,255,.12);padding-left:clamp(8px,3.5vw,14px)}
.hero-stats b{display:block;font-family:var(--mono);font-size:clamp(16px,5.8vw,26px);font-weight:500;letter-spacing:-.03em;white-space:nowrap}
.hero-stats span{font-size:12.5px;color:#9C9C9C}

/* patrocinador */
.sponsor{display:flex;gap:14px;align-items:center;padding:16px}
.sponsor .logo,#logoPrevia{width:64px;height:64px;border-radius:12px;background:#F2F2F2;border:1px dashed #E0E0E0;display:grid;place-items:center;font-size:11px;color:var(--ink-3);flex:none;overflow:hidden}
.sponsor .logo img,#logoPrevia img{width:100%;height:100%;object-fit:cover}
.sponsor .who b{font-size:18px;letter-spacing:-.02em;margin:2px 0}
.sponsor .who span{font-size:13px;color:var(--ink-2)}
.sponsor .who small{font-size:12px;color:var(--ink-2)}

/* chuteira */
.boot-top{display:flex;align-items:center;gap:14px}
.boot-ico{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:30px;flex:none}
.boot-name{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1}
.boot-goals{font-size:13px;color:var(--ink-2);margin-top:6px}
.prog{margin:22px 0 8px;height:10px;border-radius:999px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.prog-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.prog-legend b{color:var(--ink);font-weight:600}
.tiers{display:flex;gap:6px;margin-top:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tiers::-webkit-scrollbar{display:none}
.tier{flex:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:12.5px;color:var(--ink-2);background:var(--soft);min-width:92px}
.tier strong{display:block;color:var(--ink);font-weight:500;font-size:13.5px}
.tier.on{background:var(--ink);border-color:var(--ink);color:#BDBDBD}
.tier.on strong{color:#fff}
.tier.done{opacity:.55}
@media(min-width:900px){.tiers{flex-wrap:wrap;overflow:visible}.tier{min-width:0;flex:1 1 30%}}

/* chart */
.chart-wrap{position:relative;margin:4px -6px 0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tag{position:absolute;transform:translate(calc(-100% + 14px),-150%);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:999px;white-space:nowrap}
.chart-foot{display:flex;gap:18px;margin-top:14px;font-size:13px;color:var(--ink-2)}
.chart-foot b{display:block;font-family:var(--mono);font-size:20px;color:var(--ink);font-weight:500;letter-spacing:-.03em}

/* segmented */
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{padding:7px 12px;border-radius:999px;font-size:13px;color:var(--ink-2);font-weight:500;transition:.2s;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg.full{display:flex}
.seg.full button{flex:1;min-width:0;padding:7px 8px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{padding:0 0 10px;font-size:15px;color:var(--ink-3);font-weight:500;position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}

/* listas */
.rank,.list{list-style:none}
.rank li,.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank li:last-child,.list li:last-child{border-bottom:0}
.list li.edit{display:block;border-bottom:1px solid var(--line);padding:0 0 12px}
.rank .pos{width:22px;font-family:var(--mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rank li.top .pos{color:var(--ink);font-weight:500}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--ink-3)}
.li-off .who b,.li-off .who span{color:var(--ink-3)}
.rank .val{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rank li.me{background:var(--soft);margin:0 -10px;padding:11px 10px;border-radius:var(--r-sm);border-bottom-color:transparent}
.bar-mini{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--lime)}
.empty{padding:28px 0;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.5}
.list li.click{cursor:pointer}
.meta{text-align:right;flex:none}
.meta small{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.mono{font-family:var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.foot button{color:var(--ink);font-weight:500;font-size:13px}

/* formulários */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13.5px;font-weight:500;color:var(--ink);margin-bottom:8px}
.input{width:100%;font:inherit;font-size:15px;padding:13px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--soft);color:var(--ink);outline:none;min-width:0}
.input::placeholder{color:var(--ink-3);text-transform:none;letter-spacing:normal}
.input:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.code-box{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px}
.code-box b{font-weight:600;font-size:15px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:999px;font-weight:500;font-size:14px;background:var(--ink);color:#fff;white-space:nowrap;text-decoration:none}
.btn.block{width:100%;margin-top:18px;padding:15px 18px;font-size:15px;white-space:normal;text-align:center}
.dois .btn{white-space:normal;text-align:center}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.white{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.input{flex:1 1 140px;width:auto}
.msg{font-size:13px;margin-top:12px;color:var(--ink-2)}
.msg:empty{display:none}
.msg.err{color:#B42318}
.note{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.center{text-align:center;margin-top:16px}
.lnk{font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px;color:var(--ink);cursor:pointer;flex:none}
.sub-title{font-size:13.5px;font-weight:500;margin:20px 0 4px}
.search{position:relative;margin-top:2px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.search .input{padding-left:42px}
.box{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:12px}
.box .input{background:#fff}

/* opções de método */
.opt{border:1px solid var(--line);background:var(--soft);border-radius:var(--r-md);margin-top:8px}
.opt.on{background:var(--card);border:1.5px solid var(--ink)}
.opt-head{display:flex;gap:12px;align-items:flex-start;padding:14px;cursor:pointer}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #C9C9C9;flex:none;margin-top:1px;display:grid;place-items:center;background:#fff}
.opt.on .radio{border-color:var(--ink);background:var(--ink)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime)}
.opt-head b{display:block;font-weight:500;font-size:15px}
.opt-head span{font-size:12.5px;color:var(--ink-2);display:block;margin-top:3px;line-height:1.35}
.opt-extra{padding:0 14px 14px 46px}
.range-legend{display:flex;justify-content:space-between;font-size:12.5px}
.range-legend span{color:var(--ink-2)}
.range{width:100%;accent-color:var(--ink);margin-top:6px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;flex:none}
.stepper button{width:32px;height:32px;border-radius:50%;background:#fff;font-size:16px;box-shadow:var(--shadow)}
.stepper b{min-width:26px;text-align:center;font-weight:500;font-size:16px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.setting b{display:block;font-weight:500;font-size:13.5px}
.setting span{font-size:12px;color:var(--ink-3)}
.switch{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ink)}
.switch.on::after{left:21px;background:var(--lime)}
.check-row{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0}
.check-row input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.notas{display:flex;gap:4px;flex:none}
.notas button{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--soft);font-size:13px;font-weight:500}
.notas button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* votação: nome inteiro numa linha, notas embaixo ocupando a largura */
.list li.voto{flex-wrap:wrap;row-gap:10px}
.list li.voto .who{flex:1 1 0;min-width:0}
.list li.voto .notas{flex:1 1 100%;gap:6px}
.list li.voto .notas button{flex:1;width:auto;height:38px;font-size:15px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast:empty{display:none}

/* bottom nav */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(14,14,14,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.nav:empty{display:none}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:999px;color:#8C8C8C;font-size:11px;text-decoration:none;font-weight:500;min-width:64px}
.nav.cinco a{padding:8px 10px;min-width:58px}

/* cartola */
.hero .check .dot{width:8px;height:8px;border-radius:50%;background:#D6D6D6;display:inline-block}
.subnav{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.subnav a{flex:1 1 auto;min-width:0;text-align:center;padding:9px clamp(6px,2.2vw,10px);border-radius:999px;font-size:clamp(12px,3.5vw,13px);font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.subnav a.on{background:var(--ink);color:#fff}
.campo{position:relative;background:var(--lime-tint);border-radius:var(--r-md);padding:14px 8px 10px;margin-top:4px;overflow:hidden}
.campo::before{content:"";position:absolute;inset:10px;border:1.5px solid #DDEFB8;border-radius:8px;pointer-events:none}
.campo::after{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:1.5px solid #DDEFB8;border-radius:50%;pointer-events:none}
.linha-campo{display:grid;grid-template-columns:34px 1fr;align-items:center;position:relative;z-index:1;padding:6px 0}
.linha-campo>span{font-size:11px;font-weight:600;color:#5C7A2E;letter-spacing:.02em;padding-left:6px}
.vagas{display:flex;justify-content:space-around}
.slot{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1 1 0;min-width:0;max-width:112px;text-decoration:none;color:inherit;cursor:pointer}
.slot .bola{width:48px;height:48px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--accent-ink);position:relative}
.slot .bola.vazia{border:1.5px dashed #BCD98A;color:#7F9C4F;font-size:22px;font-weight:400;background:rgba(255,255,255,.6)}
.slot .bola i{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--lime);color:#0E0E0E;font-size:10.5px;font-weight:700;font-style:normal;display:grid;place-items:center}
.slot b{background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot b.vazio{background:transparent;color:#5C7A2E;border:1px dashed #BCD98A}

<script>
/* =========================================================
   SUPABASE — onde os dados ficam guardados.
   A chave publicável pode ficar no site: quem protege os
   dados são as regras de acesso (RLS) do banco.
   ========================================================= */
// O site oficial (anotoumeugol.com) usa o banco oficial; qualquer outro endereço
// (o site de testes no GitHub) usa o banco de testes, pra teste nunca mexer em dado de verdade.
const BANCOS = {
  oficial: { url: "https://rsqyxsjqdkgkcwexbkfi.supabase.co", key: "sb_publishable_VsGcdzuHKXG3cVMuBact2g_VnTJEFgB" },
  teste: { url: "https://obhrxutnpgknvuqqlfvb.supabase.co", key: "sb_publishable_NcsSb-8kpIf0ZnUOxMMhKg_1ck11vdd" }   // projeto "anotou teste"

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ===================== ESTADO =====================
   3 níveis de acesso:
   - dev (administrador da plataforma): vê e altera todas as peladas
   - presidente: altera a própria pelada

const vazio = () => ({ user: null, perfil: null, dev: false, modoDev: false, patrocinio: {},

const app = vazio();
const state = { periodo: "mes", stat: "gols", login: "codigo", loginEmail: "", loginPelada: "",

  buscaJog: "", filtroJog: "todos", verTodosJog: false, editando: null, addJogador: false, editMetrica: null,
  mercPos: "todos", mercBusca: "", mercOrdem: "media", mercTodos: false, pontRodada: null, faq: 0, renomear: false,
  capitao: null, capitaoRodada: undefined, confirmEncerrar: false, editScout: null, ajustesAbertos: false, editarTime: false, formTime: null, modal: null, modalVisto: false, pos: null, verPartidas: false, menuPerfil: false, votosVistos: new Set(), guiaPasso: 0, votarIds: [], troca: null };

/* ===================== REGRAS ===================== */
const CHUTEIRAS = [
  { nome: "Plástico", min: 0,   cor: "#F6DCDC", emoji: "👟", filtro: "grayscale(1) sepia(1) saturate(3) hue-rotate(300deg)" },

  { nome: "Prata",    min: 50,  cor: "#E9ECEF", emoji: "👟", filtro: "grayscale(1) brightness(1.6)" },
  { nome: "Ouro",     min: 75,  cor: "#F8EDC4", emoji: "👟", filtro: "sepia(1) saturate(4) hue-rotate(5deg) brightness(1.15)" },

  { k: "votacao",     nome: "Votação dos jogadores", desc: "Depois de cada pelada, os jogadores votam nos colegas." },

];
const STATUS = { ativa: "Ativa", pausada: "Pausada", inativa: "Inativa" };

const chuteiraDe = g => [...CHUTEIRAS].reverse().find(c => g >= c.min);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const urlSegura = u => /^https?:\/\//i.test(u || "") ? u : "";
const iniciais = n => String(n || "?").split(" ").filter(Boolean).slice(0,2).map(p => p[0]).join("").toUpperCase();
const avatar = (nome, foto, off) => `<span class="av${off?" off":""}">${urlSegura(foto) ? `<img src="${esc(foto)}" alt="">` : esc(iniciais(nome))}</span>`;
const fmt = n => n.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtPeso = n => Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 2 });
const dataCurta = s => { const [y,m,d] = s.split("-"); return `${d}/${m}`; };
const dataBr = s => { const [y,m,d] = s.slice(0,10).split("-"); return `${d}/${m}/${y}`; };
const dataLonga = s => new Date(s + "T12:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
const iso = t => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
const hoje = () => iso(new Date());
const diasAtras = n => { const t = new Date(); t.setDate(t.getDate() - n); return iso(t); };
const mesAtual = () => hoje().slice(0, 7);

// perfil criado antes da pessoa ter conta: vira conta quando ela se cadastrar com o e-mail ligado a ele
const rotuloMembro = m => `${cap(m.tipo)}${m.posicao ? ` · ${m.posicao}` : ""}${m.papel === "presidente" ? " · presidente" : ""}${m.jogadores.pendente ? " · aguardando cadastro" : ""}`;

const ICONES = {
  casa: `<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>`,
  pessoas: `<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>`,
  barras: `<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>`,
  agenda: `<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>`,

/* ===================== POTES =====================
   Cada jogador recebe uma nota de 0 a 1 conforme o método da pelada.
   A nota vira pote (1 = melhor) e aparece no gráfico na escala de 1 a 6. */
function janela(offset = 0){
  const dias = app.pelada.janela_semanas * 7;
  const fim = diasAtras(offset * dias), ini = diasAtras((offset + 1) * dias);
  return new Set(app.partidas.filter(p => p.data > ini && p.data <= fim).map(p => p.id));
}

function valorMetrica(m, jid, ids){
  const jogou = app.presencas.filter(p => p.jogador_id === jid && ids.has(p.partida_id)).length;
  switch (m.chave) {
    case "gols": return app.gols.filter(g => g.autor_id === jid && ids.has(g.partida_id)).length;
    case "assistencias": return app.gols.filter(g => g.assistencia_id === jid && ids.has(g.partida_id)).length;
    case "jogos": return jogou;
    case "presenca": return ids.size ? (jogou / ids.size) * 10 : 0;
    default: return app.lances.filter(l => l.jogador_id === jid && l.metrica === m.chave && ids.has(l.partida_id))
      .reduce((s, l) => s + l.qtd, 0);
  }
}

function avaliar(ids){
  const P = app.pelada, votos = new Map(), desemp = new Map(), notas = new Map();
  for (const m of app.membros) {
    const r = app.medias.filter(x => x.jogador_id === m.jogador_id && ids.has(x.partida_id));
    if (r.length) votos.set(m.jogador_id, r.reduce((s, x) => s + (Number(x.media) - 1) / 5, 0) / r.length);
  }
  const ativas = P.metricas.filter(m => m.ativo);
  const presentes = new Set(app.presencas.filter(p => ids.has(p.partida_id)).map(p => p.jogador_id));
  const pts = new Map([...presentes].map(j => [j, ativas.reduce((s, m) => s + valorMetrica(m, j, ids) * Number(m.peso), 0)]));
  const max = Math.max(0, ...pts.values());
  pts.forEach((v, j) => desemp.set(j, max > 0 ? v / max : 0));
  const w = P.peso_votacao / 100;
  for (const m of app.membros) {
    const j = m.jogador_id, v = votos.get(j), d = desemp.get(j);
    const n = P.metodo === "votacao" ? v
      : P.metodo === "desempenho" ? d
      : P.metodo === "misto" ? (v != null && d != null ? w * v + (1 - w) * d : v ?? d)
      : undefined;
    if (n != null) notas.set(j, n);
  }
  return notas;
}

const poteDaNota = s => { const N = app.pelada.qtd_potes; return Math.min(Math.max(N - Math.floor(s * N), 1), N); };

function potes(offset = 0){
  const out = new Map();
  if (app.pelada.metodo === "organizador") {
    app.membros.forEach(m => m.pote_manual && out.set(m.jogador_id, { pote: Math.min(m.pote_manual, app.pelada.qtd_potes), nota: null }));
    return out;
  }
  avaliar(janela(offset)).forEach((s, j) => out.set(j, { pote: poteDaNota(s), nota: 1 + 5 * s }));
  return out;
}

function minhaSerie(){
  if (app.pelada.metodo === "organizador") return [];
  return app.partidas.filter(p => p.data <= hoje())
    .map(p => ({ semana: p.data, s: avaliar(new Set([p.id])).get(app.user.id) }))
    .filter(x => x.s != null)
    .map(x => ({ semana: x.semana, media: 1 + 5 * x.s }));
}

async function entrar(user){
  app.user = user;
  gravar("email", user.email);
  await run(async () => {
    const [perfil, devs, config] = (await Promise.all([
      sb.from("jogadores").select("*").eq("id", user.id).single(),
      sb.from("devs").select("jogador_id").eq("jogador_id", user.id),
      sb.from("config").select("patrocinio").maybeSingle()
    ])).map(ok);
    app.perfil = perfil;
    app.dev = devs.length > 0;
    app.patrocinio = (config && config.patrocinio) || {};
    const convite = ler("convite");
    gravar("convite", null);
    // o dev não entra em pelada por código: ele vê todas pelo painel, sem virar jogador
    if (convite && !app.dev) {
      const id = ok(await sb.rpc("entrar_na_pelada", { codigo: convite }));
      gravar("pelada", id);
      aviso(convite.replace(/[^A-Z0-9]/g, "").length === 10 ? "Você entrou como presidente!" : "Você entrou na pelada!");
    }
    await carregarPeladas();
    app.modoDev = app.dev;   // dev sempre abre no painel de developer
    if (app.modoDev) {
      await carregarTodas();
      if (!NAV_DEV.some(n => n[0] === location.hash.slice(1))) location.hash = "peladas";
      return route();
    }
    const salva = app.peladas.find(p => p.id === ler("pelada"));
    const escolhida = salva || (app.peladas.length === 1 ? app.peladas[0] : null);
    if (escolhida) await abrirPelada(escolhida.id); else route();
    if (guiaPendente(user)) {
      gravar("guia", "1");
      sb.auth.updateUser({ data: { guia_visto: true } }).catch(() => {});
      abrirGuia();
    }
  });
}

// O Supabase devolve no máximo 1000 linhas por consulta: busca em páginas até acabar
async function tudo(consulta){
  const linhas = [];
  for (let de = 0; ; de += 1000) {
    const r = ok(await consulta().range(de, de + 999));
    linhas.push(...r);
    if (r.length < 1000) return { data: linhas, error: null };
  }
}

async function carregar(){
  const p = app.pelada.id;
  const [pelada, codPres, membros, partidas, gols, presencas, lances, medias, meusVotos, pendentes] = (await Promise.all([
    sb.from("peladas").select("*").eq("id", p).single(),
    sb.from("codigos_presidente").select("sufixo").eq("pelada_id", p),   // só dev e presidente recebem
    tudo(() => sb.from("membros").select("jogador_id, papel, tipo, pote_manual, entrou_em, posicao, preco, jogadores(nome, apelido, foto_url, pendente)").eq("pelada_id", p)),
    tudo(() => sb.from("partidas").select("id, data, modo").eq("pelada_id", p).order("data")),
    tudo(() => sb.from("gols").select("id, partida_id, autor_id, assistencia_id").eq("pelada_id", p).order("criado_em").order("id")),
    tudo(() => sb.from("presencas").select("partida_id, jogador_id").eq("pelada_id", p).order("partida_id").order("jogador_id")),
    tudo(() => sb.from("lances").select("id, partida_id, jogador_id, metrica, qtd").eq("pelada_id", p).order("id")),
    sb.rpc("medias", { p }),
    tudo(() => sb.from("votos").select("partida_id, votado_id, nota").eq("pelada_id", p).eq("votante_id", app.user.id).order("id")),
    sb.from("perfis_pendentes").select("jogador_id, email")   // só dev e presidente recebem
  ])).map(ok);
  Object.assign(app, { membros, partidas, gols, presencas, lances, medias, meusVotos });
  await carregarLista();
  app.emails = new Map(pendentes.map(x => [x.jogador_id, x.email]));
  app.pelada = { ...pelada, papel: app.pelada.papel, sufixo: codPres.length ? codPres[0].sufixo : null };
  app.membro = membroDe(app.user.id);
  if (!app.membro && !app.modoDev) {   // foi removido da pelada
    app.pelada = null;
    await carregarPeladas();
    return;
  }
  await carregarCartola();
}

async function carregarLista(){
  const p = app.pelada.id;
  app.jogo = ok(await sb.rpc("proximo_jogo", { p }))[0] || null;
  app.lista = []; app.confirmacoes = []; app.timesJogo = []; app.confrontos = [];
  if (!app.jogo) return;
  const [lista, conf, timesJogo, confrontos] = (await Promise.all([
    sb.rpc("lista_do_jogo", { p, d: app.jogo.data }),
    sb.from("confirmacoes").select("jogador_id, vou, criado_em, liberado").eq("pelada_id", p).eq("data", app.jogo.data),
    sb.from("times_do_jogo").select("jogador_id, time").eq("pelada_id", p).eq("data", app.jogo.data),
    sb.from("confrontos").select("*").eq("pelada_id", p).eq("data", app.jogo.data).order("criado_em")
  ])).map(ok);

}

function rankingDe(periodo){
  const mes = mesAtual();
  const ids = new Set((periodo === "semana" ? app.partidas.filter(p => p.data > diasAtras(7))
    : periodo === "mes" ? app.partidas.filter(p => p.data.startsWith(mes))
    : app.partidas).map(p => p.id));
  const gols = app.gols.filter(g => ids.has(g.partida_id));
  return app.membros.map(m => ({
    id: m.jogador_id,
    nome: m.jogadores.apelido || m.jogadores.nome,
    foto: m.jogadores.foto_url,
    tipo: cap(m.tipo),
    gols: gols.filter(g => g.autor_id === m.jogador_id).length,
    assistencias: gols.filter(g => g.assistencia_id === m.jogador_id).length,
    me: m.jogador_id === app.user.id
  }));
}

function rankingGlobal(periodo){
  const G = app.global;
  const mes = mesAtual(), semana = diasAtras(7);
  const ids = new Set(G.partidas.filter(p => periodo === "geral" || (periodo === "mes" ? p.data.startsWith(mes) : p.data > semana)).map(p => p.id));
  const gols = G.gols.filter(g => ids.has(g.partida_id));
  return G.jogadores.map(j => ({
    id: j.id,
    nome: j.apelido || j.nome,
    foto: j.foto_url,
    tipo: plural(new Set(G.membros.filter(m => m.jogador_id === j.id).map(m => m.pelada_id)).size, "pelada", "peladas"),
    gols: gols.filter(g => g.autor_id === j.id).length,
    assistencias: gols.filter(g => g.assistencia_id === j.id).length,
    me: j.id === app.user.id
  }));
}

    v = views[location.hash.slice(1)] ? location.hash.slice(1) : "peladas";

    v = views[location.hash.slice(1)] ? location.hash.slice(1) : "inicio";

    views[v]();
    if (["mercado", "liga", "pontuacao", "regras"].includes(v)) v = "cartola";

function renderRanking(limite, fonte, titulo){
  const lista = fonte(state.periodo)
    .filter(p => p[state.stat] > 0)
    .sort((a,b) => b[state.stat] - a[state.stat] || a.nome.localeCompare(b.nome, "pt-BR"));
  const max = lista.length ? lista[0][state.stat] : 1;
  const per = { semana: "Semana", mes: "Mês", geral: "Geral" };
  document.getElementById("ranking").innerHTML = `
    <div class="card-head" style="flex-wrap:wrap">
      <div><div class="eyebrow">${titulo ? esc(titulo) : "Rankings"}</div><div class="h2">Artilheiros e garçons</div></div>
      <div class="seg" role="tablist">
        ${Object.entries(per).map(([k,v]) => `<button class="${state.periodo===k?"on":""}" data-p="${k}">${v}</button>`).join("")}
      </div>
    </div>
    <div class="tabs">
      <button class="${state.stat==="gols"?"on":""}" data-s="gols">⚽ Gols</button>
      <button class="${state.stat==="assistencias"?"on":""}" data-s="assistencias">🎯 Assistências</button>
    </div>
    ${lista.length ? `<ol class="rank">
      ${lista.slice(0, limite).map((p,i) => `
        <li class="${i<3?"top":""} ${p.me?"me":""}">
          <span class="pos">${i+1}</span>
          ${avatar(p.nome, p.foto)}
          <div class="who"><b>${esc(p.nome)}${p.me?" · você":""}</b><span>${esc(p.tipo)}</span>
            <div class="bar-mini"><i style="width:${(p[state.stat]/max*100).toFixed(0)}%"></i></div></div>
          <span class="val">${p[state.stat]}</span>
        </li>`).join("")}
    </ol>` : `<div class="empty">Nenhum registro nesse período.</div>`}`;
  document.querySelectorAll("#ranking [data-p]").forEach(b => b.onclick = () => { state.periodo = b.dataset.p; renderRanking(limite, fonte, titulo); });
  document.querySelectorAll("#ranking [data-s]").forEach(b => b.onclick = () => { state.stat = b.dataset.s; renderRanking(limite, fonte, titulo); });
}

/* ===================== CARTOLA DA PELADA (Slides 08 a 11) =====================
   Cada jogador monta um time de 6 com C$ 60. Compras, vendas e capitão passam
   por funções do banco, que conferem saldo, vagas e se o mercado está aberto. */
// só posições de linha: na pelada o goleiro não é fixo, então ele não existe no app
const POSICOES = ["ZAG", "MEI", "ATA"];
const TAM_TIME = 6;
const ESQUEMAS = [["2-2-2", "Equilibrado"], ["3-2-1", "Defensivo"], ["2-1-3", "Ofensivo"], ["2-3-1", "Meio forte"]];
const vagasDe = esquema => { const [z, m, a] = (esquema || "2-2-2").split("-").map(Number); return { ZAG: z, MEI: m, ATA: a }; };
const noMercado = m => !!m.posicao;
// lista de espera: pode ser escalado, mas é dúvida (se não jogar, faz 0 ponto)
const duvida = id => situacaoDe(id) === "espera";
const esquemaAtual = () => (cart().meuTime || {}).esquema || "2-2-2";

/* ---------- Escudo do time (desenhado na hora, a partir de forma, padrão, cores e sigla) ---------- */
const CORES_TIME = ["#0C0C0C", "#FFFFFF", "#17A34A", "#C9F36B", "#1D4ED8", "#60A5FA", "#DC2626", "#F59E0B", "#FACC15", "#7C3AED", "#EC4899", "#78350F"];
const FORMAS_ESCUDO = [["classico", "Clássico"], ["moderno", "Moderno"], ["redondo", "Redondo"], ["losango", "Losango"]];
const PADROES_ESCUDO = [["liso", "Liso"], ["listras", "Listras"], ["faixa", "Faixa"], ["metade", "Metade"]];
const escudoPadrao = nome => ({ forma: "classico", padrao: "liso", cor1: "#0C0C0C", cor2: "#C9F36B", sigla: iniciais(nome || "FC").slice(0, 3) || "FC" });
let idEscudo = 0;
function escudoSvg(e, tam = 40){
  e = e || escudoPadrao("?");
  const id = `esc${++idEscudo}`;
  const contorno = {
    classico: `<path d="M20 2 36 7v13c0 10-7 16-16 19C11 36 4 30 4 20V7z"/>`,
    moderno: `<path d="M6 3h28v19c0 9-6 14-14 17C12 36 6 31 6 22z"/>`,
    redondo: `<circle cx="20" cy="20" r="18"/>`,
    losango: `<path d="M20 2 38 20 20 38 2 20z"/>`
  }[e.forma] || "";
  const desenho = {
    liso: "",
    listras: [6, 14, 22, 30].map(x => `<rect x="${x}" y="0" width="4" height="40" fill="${e.cor2}"/>`).join(""),
    faixa: `<path d="M0 26 26 0h10L0 36z" fill="${e.cor2}"/>`,
    metade: `<rect x="20" y="0" width="20" height="40" fill="${e.cor2}"/>`
  }[e.padrao] || "";
  const claro = c => { const n = parseInt(c.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150; };
  const corTexto = e.padrao === "liso" ? (claro(e.cor1) ? "#0C0C0C" : "#FFFFFF") : "#FFFFFF";
  return `<svg class="escudo" width="${tam}" height="${tam}" viewBox="0 0 40 40" aria-hidden="true">
    <defs><clipPath id="${id}">${contorno}</clipPath></defs>
    <g clip-path="url(#${id})"><rect width="40" height="40" fill="${e.cor1}"/>${desenho}</g>
    <g fill="none" stroke="rgba(12,12,12,.85)" stroke-width="1.6">${contorno}</g>
    <text x="20" y="${e.forma === "losango" ? 24 : 23}" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="${e.sigla.length > 2 ? 10 : 12}"
      fill="${corTexto}" stroke="${e.padrao === "liso" ? "none" : "rgba(12,12,12,.55)"}" stroke-width="2" paint-order="stroke">${esc(e.sigla)}</text>
  </svg>`;
}
const NOME_POS = { ZAG: ["zagueiro", "zagueiros"], MEI: ["meia", "meias"], ATA: ["atacante", "atacantes"] };
const DIAS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const DIAS_CURTOS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const CAPITAO = 1.5;
const GRUPOS_SCOUT = [["Ataque", ["G", "A", "FT", "FD", "FF", "FS"]], ["Defesa", ["DS", "SG", "V"]], ["Negativos", ["GC", "PP", "FC", "CA", "CV"]]];
const SCOUTS_SIMPLES = ["G", "A", "V", "SG", "GC", "CA", "CV"];   // o básico que todo organizador consegue anotar
// scouts com a configuração da pelada: ligado/desligado e pontos trocados pelo presidente
const scoutsDaPelada = () => {
  const off = app.pelada.cartola_scouts_off || [], troca = app.pelada.cartola_pontos || {};
  return cart().regras.map(r => ({ ...r, padrao: Number(r.pontos), pontos: troca[r.codigo] != null ? Number(troca[r.codigo]) : Number(r.pontos), ativo: !off.includes(r.codigo) }));
};
const cs = n => Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pts = n => Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const sinal = (n, f = pts) => `${n < 0 ? "−" : "+"}${f(Math.abs(n))}`;
const precoDe = id => Number((membroDe(id) || {}).preco || 0);

async function carregarCartola(){
  const p = app.pelada.id;
  const [regras, rodadas, times, escalacoes, scouts, resultados, pontosTime] = (await Promise.all([
    sb.from("cartola_scouts_regras").select("*"),
    tudo(() => sb.from("cartola_rodadas").select("*").eq("pelada_id", p).order("numero")),
    tudo(() => sb.from("cartola_times").select("*").eq("pelada_id", p).order("jogador_id")),
    tudo(() => sb.from("cartola_escalacoes").select("*").eq("pelada_id", p).order("rodada_id").order("jogador_id").order("atleta_id")),
    tudo(() => sb.from("cartola_scouts").select("*").eq("pelada_id", p).order("rodada_id").order("atleta_id").order("codigo")),
    tudo(() => sb.from("cartola_resultados").select("*").eq("pelada_id", p).order("rodada_id").order("atleta_id")),
    tudo(() => sb.from("cartola_pontos_time").select("*").eq("pelada_id", p).order("rodada_id").order("jogador_id"))
  ])).map(ok);
  let meuTime = null;
  if (app.membro && !app.modoDev && app.pelada.cartola_ativo) {
    meuTime = ok(await sb.rpc("cartola_meu_time", { p }));
    if (!times.some(t => t.jogador_id === meuTime.jogador_id)) times.push(meuTime);
  }
  app.cartola = { regras, rodadas, times, escalacoes, scouts, resultados, pontosTime, meuTime };
}

const cart = () => app.cartola || { regras: [], rodadas: [], times: [], escalacoes: [], scouts: [], resultados: [], pontosTime: [], meuTime: null };
const rodadaAberta = () => [...cart().rodadas].reverse().find(r => r.status === "aberta") || null;
// mercado abre à 0h do dia da pelada e fecha 1h antes do jogo (regra no banco, migração 017)
const mercadoAbreEm = () => app.jogo ? new Date(`${app.jogo.data}T00:00:00-03:00`) : null;
const mercadoFechaEm = () => app.jogo ? new Date(new Date(app.jogo.inicio) - 36e5) : null;
const mercadoAberto = () => { const r = rodadaAberta(), a = mercadoAbreEm(), agora = new Date(); return !!r && !!a && agora >= a && agora < mercadoFechaEm(); };
const encerradas = () => cart().rodadas.filter(r => r.status === "encerrada");
const ultimaEncerrada = () => encerradas().slice(-1)[0] || null;
const escalacaoDe = (rodadaId, dono = app.user.id) => cart().escalacoes.filter(e => e.rodada_id === rodadaId && e.jogador_id === dono);
const meuEscalado = () => { const r = rodadaAberta(); return r ? escalacaoDe(r.id) : []; };
const resultado = (rodadaId, atletaId) => cart().resultados.find(x => x.rodada_id === rodadaId && x.atleta_id === atletaId);
const pontosDoTime = (rodadaId, dono = app.user.id) => { const x = cart().pontosTime.find(y => y.rodada_id === rodadaId && y.jogador_id === dono); return x ? Number(x.pontos) : null; };
const variacaoDoTime = rodadaId => escalacaoDe(rodadaId).reduce((s, e) => { const r = resultado(rodadaId, e.atleta_id); return s + (r ? r.preco_depois - r.preco_antes : 0); }, 0);

function infoAtleta(id){
  const res = cart().resultados.filter(r => r.atleta_id === id);
  const jogados = res.filter(r => r.jogou);
  const ult = ultimaEncerrada();
  const rUlt = ult && res.find(r => r.rodada_id === ult.id);
  return {
    media: jogados.length ? jogados.reduce((s, r) => s + Number(r.pontos), 0) / jogados.length : 0,
    ultima: rUlt ? Number(rUlt.pontos) : 0,
    variacao: rUlt ? Number(rUlt.preco_depois) - Number(rUlt.preco_antes) : 0
  };
}

function faltaTempo(fecha){
  const ms = new Date(fecha) - new Date();
  if (ms <= 0) return null;
  const min = Math.floor(ms / 6e4), h = Math.floor(min / 60), d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : h ? `${h}h ${min % 60}min` : `${Math.max(1, min)}min`;
}
function textoMercado(){
  const r = rodadaAberta();
  if (!r) return "O presidente ainda não abriu a rodada";
  if (!app.jogo) return "Defina o dia da pelada para abrir o mercado";
  if (mercadoAberto()) return `Mercado fecha 1h antes da pelada · faltam ${faltaTempo(mercadoFechaEm())}`;
  if (new Date() < mercadoAbreEm()) return `Mercado abre ${momento(mercadoAbreEm())} · faltam ${faltaTempo(mercadoAbreEm())}`;
  return "Mercado fechado · os pontos saem quando o presidente lançar as estatísticas";
}
function statusRodada(){
  const r = rodadaAberta();
  if (!r) { const u = ultimaEncerrada(); return u ? `Rodada ${u.numero} · Encerrada` : "Cartola da pelada"; }
  return `Rodada ${r.numero} · Mercado ${mercadoAberto() ? "aberto" : "fechado"}`;
}
function liga(){
  const total = new Map();
  cart().pontosTime.forEach(x => total.set(x.jogador_id, (total.get(x.jogador_id) || 0) + Number(x.pontos)));
  return cart().times.map(t => ({ ...t, total: total.get(t.jogador_id) || 0 }))
    .sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome, "pt-BR"));
}
const minhaPosicaoLiga = () => { const i = liga().findIndex(t => t.jogador_id === app.user.id); return i < 0 ? null : i + 1; };
function faltamNoTime(escalados){
  const vagas = vagasDe(esquemaAtual());
  const faltas = POSICOES.map(p => [p, vagas[p] - escalados.filter(e => e.posicao === p).length]).filter(([, n]) => n > 0);
  if (!faltas.length) return "Time completo";
  const partes = faltas.map(([p, n]) => `${n} ${NOME_POS[p][n > 1 ? 1 : 0]}`);
  const total = faltas.reduce((s, [, n]) => s + n, 0);
  return `Falta${total > 1 ? "m" : ""} escalar ${partes.length > 1 ? partes.slice(0, -1).join(", ") + " e " + partes.slice(-1) : partes[0]}`;
}

function heroCartola({ status, titulo, sub, rotulo, numero, pill, pillLime = true, meta, stats }){
  return `
    <section class="hero fade" style="min-height:0">
      <span class="check"><i class="dot"></i>${esc(status)}</span>
      <h1 class="sm">${esc(titulo)}</h1>
      <p class="sub">${esc(sub)}</p>
      <div class="pote-label">${esc(rotulo)}</div>
      <div class="pote-row" style="margin:0 0 22px">
        <div class="pote-num">${numero}</div>
        <div class="pote-meta">${pill ? `<span class="pill ${pillLime ? "lime" : "ghost"}">${pill}</span>` : ""}<p>${meta || ""}</p></div>
      </div>
      <div class="hero-stats">${stats.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("")}</div>
    </section>`;
}
const subnavCartola = ativo => `<nav class="subnav span2 fade">${[["cartola", cart().meuTime ? "Meu time" : "Visão geral"], ["mercado", "Mercado"], ["liga", "Liga"], ["pontuacao", "Pontos"], ["regras", "Regras"]]
  .map(([k, v]) => `<a href="#${k}" class="${k === ativo ? "on" : ""}">${v}</a>`).join("")}</nav>`;

  const varRodada = ult ? variacaoDoTime(ult.id) : null;

        <b>${esc(nomeDe(e.atleta_id))}</b><small>${duvida(e.atleta_id) ? "Dúvida · " : ""}C$ ${cs(precoDe(e.atleta_id))}</small>

        <select class="select-pill" data-change="cartEsquema" aria-label="Formação" ${aberto || !r ? "" : "disabled"}>

function renderListaMerc(){
  const el = document.getElementById("listaMerc");
  if (!el) return;
  const temTime = !!cart().meuTime;
  const aberto = mercadoAberto(), saldo = temTime ? Number(cart().meuTime.saldo) : 0;
  const escalados = meuEscalado();
  const busca = state.mercBusca.trim().toLowerCase();
  const ordem = { media: (a, b) => b.media - a.media, ultima: (a, b) => b.ultima - a.ultima, caro: (a, b) => b.preco - a.preco, barato: (a, b) => a.preco - b.preco }[state.mercOrdem];
  const todos = app.membros.filter(noMercado)
    .filter(m => ["confirmado", "espera"].includes(situacaoDe(m.jogador_id)) || escalados.some(e => e.atleta_id === m.jogador_id))
    .filter(m => state.mercPos === "todos" || m.posicao === state.mercPos)
    .filter(m => !busca || `${m.jogadores.nome} ${m.jogadores.apelido || ""}`.toLowerCase().includes(busca))
    .map(m => ({ m, preco: Number(m.preco), meu: escalados.some(e => e.atleta_id === m.jogador_id), ...infoAtleta(m.jogador_id) }))

/* ---------- Cartola · cruzamento com a partida ----------
   O presidente anota tudo na partida (gols, assistências e "outras métricas").
   Ao encerrar a rodada, o banco transforma isso em scouts; aqui é só a prévia. */
const METRICA_DO_SCOUT = { V: "vitorias", CA: "cartao_amarelo", CV: "cartao_vermelho", GC: "gol_contra" };
const CODIGOS_LANCE = ["FT", "FD", "FF", "FS", "DS", "SG", "V", "GC", "PP", "FC", "CA", "CV"];
function scoutDaMetrica(metrica){
  const k = String(metrica).toLowerCase();
  const mapeado = Object.keys(METRICA_DO_SCOUT).find(c => METRICA_DO_SCOUT[c] === k);
  if (mapeado) return mapeado;
  return CODIGOS_LANCE.includes(String(metrica).toUpperCase()) ? String(metrica).toUpperCase() : null;
}
// o que dá pra marcar numa partida: métricas da pelada + scouts do Cartola ligados (sem repetir)
function opcoesLance(){
  const op = new Map();
  app.pelada.metricas.filter(m => m.ativo && m.tipo === "manual").forEach(m => op.set(m.chave, m.nome));
  if (app.pelada.cartola_ativo) scoutsDaPelada().filter(s => s.ativo && s.codigo !== "G" && s.codigo !== "A").forEach(s => {
    const valor = METRICA_DO_SCOUT[s.codigo] || s.codigo;
    if (!op.has(valor)) op.set(valor, s.nome);
  });
  return [...op];
}
const nomeLance = metrica => (app.pelada.metricas.find(m => m.chave === metrica) || {}).nome
  || (cart().regras.find(r => r.codigo === scoutDaMetrica(metrica)) || {}).nome || metrica;

// partida da rodada: a escolhida ou a mais recente ainda sem rodada (mesma regra do banco)
function partidaDaRodada(r){
  if (r.partida_id) return app.partidas.find(p => p.id === r.partida_id) || null;
  const usadas = new Set(cart().rodadas.map(x => x.partida_id).filter(Boolean));
  return [...app.partidas].reverse().find(p => !usadas.has(p.id)) || null;
}
function scoutsDaPartida(partidaId){
  const ativos = new Set(scoutsDaPelada().filter(s => s.ativo).map(s => s.codigo));
  const conta = new Map();
  const soma = (atleta, codigo, n) => { if (!atleta || !codigo || !ativos.has(codigo)) return; const k = atleta + "|" + codigo; conta.set(k, (conta.get(k) || 0) + n); };
  app.gols.filter(g => g.partida_id === partidaId).forEach(g => { soma(g.autor_id, "G", 1); soma(g.assistencia_id, "A", 1); });
  app.lances.filter(l => l.partida_id === partidaId).forEach(l => soma(l.jogador_id, scoutDaMetrica(l.metrica), l.qtd));
  // Baliza zero: zagueiro do time que venceu sem sofrer gol (só dá pra prever na partida do dia, que tem os placares carregados)
  const pa = app.partidas.find(p => p.id === partidaId);
  if (pa && app.jogo && pa.data === app.jogo.data) app.confrontos.forEach(c => [[c.time_a, c.gols_a, c.gols_b], [c.time_b, c.gols_b, c.gols_a]]
    .forEach(([time, feitos, sofridos]) => { if (feitos > 0 && sofridos === 0) app.timesJogo
      .filter(t => t.time === time && (membroDe(t.jogador_id) || {}).posicao === "ZAG").forEach(t => soma(t.jogador_id, "SG", 1)); }));
  return [...conta].map(([k, qtd]) => { const [atleta, codigo] = k.split("|"); return { atleta, codigo, qtd }; });
}

// bloco "partida desta rodada" com a prévia do que vira ponto
function cartPartidaHtml(r){
  const partida = partidaDaRodada(r);
  const usadas = new Set(cart().rodadas.filter(x => x.id !== r.id).map(x => x.partida_id).filter(Boolean));
  const livres = [...app.partidas].reverse().filter(p => !usadas.has(p.id));
  const scouts = partida ? scoutsDaPartida(partida.id) : [];
  const presentes = partida ? app.presencas.filter(p => p.partida_id === partida.id).length : 0;
  const porCodigo = new Map();
  scouts.forEach(s => porCodigo.set(s.codigo, (porCodigo.get(s.codigo) || 0) + s.qtd));
  const resumo = [...porCodigo].map(([c, n]) => `${c} ${n}`).join(" · ");
  return `
    <label class="field"><span>Partida desta rodada</span>
      <select class="input" data-change="cartPartida">
        ${livres.length ? "" : `<option value="">Nenhuma partida lançada ainda</option>`}
        ${livres.map(p => `<option value="${p.id}" ${partida && partida.id === p.id ? "selected" : ""}>${dataLonga(p.data)}${!r.partida_id && partida && partida.id === p.id ? " (sugerida)" : ""}</option>`).join("")}
      </select></label>
    ${partida ? `
      <div class="box" style="margin-top:10px">
        <b style="font-size:14px;font-weight:500">Puxado automaticamente da partida</b>
        <p class="note" style="margin-top:4px">${plural(presentes, "jogador presente", "jogadores presentes")} · ${scouts.length ? esc(resumo) : "nenhum gol ou métrica lançada ainda"}</p>
        ${scouts.length ? `<ul class="list" style="margin-top:4px">

/* ===================== LISTA DE CONFIRMAÇÃO =====================
   Abre 3 dias antes do jogo e fecha 2 horas antes (regras no banco, migração 012).
   Mensalista entra direto; avulso espera vaga. Quem está na lista avalia os outros da lista. */
const mensalistas = () => app.membros.filter(m => m.tipo === "mensalista").length;
const momento = t => { const d = new Date(t), m = String(d.getMinutes()).padStart(2, "0"); return `${DIAS[d.getDay()]}, ${dataCurta(iso(d))} às ${d.getHours()}h${m !== "00" ? m : ""}`; };
function listaStatus(){
  const j = app.jogo, agora = new Date();
  return !j ? "sem" : agora < new Date(j.abre) ? "antes" : agora < new Date(j.fecha) ? "aberta" : "fechada";
}
const situacaoDe = id => (app.lista.find(l => l.jogador_id === id) || {}).situacao || "fora";
const confDe = id => app.confirmacoes.find(c => c.jogador_id === id);
const porChegada = (a, b) => new Date(confDe(a).criado_em) - new Date(confDe(b).criado_em);
const naLista = () => app.lista.filter(l => l.situacao === "confirmado").map(l => l.jogador_id).sort(porChegada);
const naEspera = () => app.lista.filter(l => l.situacao === "espera").sort((a, b) => a.ordem - b.ordem).map(l => l.jogador_id);
const partidaDoJogo = () => app.jogo && app.partidas.find(p => p.data === app.jogo.data);
const notaMinha = vid => { const pa = partidaDoJogo(); return pa && (app.meusVotos.find(v => v.partida_id === pa.id && v.votado_id === vid) || {}).nota; };
const faltaVotar = () => situacaoDe(app.user.id) === "confirmado" ? naLista().filter(id => id !== app.user.id && !notaMinha(id)) : [];
const RELOGIO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
function textoPrazo(){
  const j = app.jogo, s = listaStatus();
  if (s === "antes") return `A lista abre <b>${momento(j.abre)}</b> · faltam ${faltaTempo(j.abre)}`;
  if (s === "aberta") return `Confirmação e votação fecham <b>${momento(j.fecha)}</b> · faltam ${faltaTempo(j.fecha)}`;
  return `Lista fechada · o jogo é <b>${momento(j.inicio)}</b>`;
}
function linhaLista(id, i, espera){
  const m = membroDe(id);

function popupAutomatico(){
  if (!app.user || app.modoDev || !app.pelada || !app.membro || state.modal) return;
  if (listaStatus() !== "aberta") return;
  if (!confDe(app.user.id)) {
    if (state.modalVisto) return;
    state.modal = "confirmar";
    state.modalVisto = true;
  } else {
    const falta = faltaVotar();
    if (!falta.some(id => !state.votosVistos.has(id))) return;
    falta.forEach(id => state.votosVistos.add(id));
    state.votarIds = falta;
    state.modal = "votar";
  }
  renderModal();
}
// lista aberta: confere a cada minuto e quando o app volta pra tela se alguém novo confirmou
async function vigiarVotacao(voltou){
  if (!app.user || app.modoDev || !app.pelada || !app.membro || listaStatus() !== "aberta" || document.hidden) return;
  try { await atualizarVotacao(); } catch (e) { return; }
  if (voltou) state.votosVistos.clear();
  const digitando = ["INPUT", "SELECT", "TEXTAREA"].includes((document.activeElement || {}).tagName);
  if (state.modal === "votar") {   // pop-up aberto: quem confirmou agora entra no fim da lista dele
    faltaVotar().filter(id => !state.votarIds.includes(id)).forEach(id => { state.votarIds.push(id); state.votosVistos.add(id); });
    renderModal();
  } else if (!state.modal && !digitando) route(true);
  else popupAutomatico();
}

const QTD_TIMES = 4;
const COLETES = [["Preto", "#0E0E0E"], ["Branco", "#FFFFFF"], ["Verde", "#B5F23D"], ["Azul", "#1D4ED8"], ["Vermelho", "#DC2626"], ["Amarelo", "#FACC15"], ["Roxo", "#7C3AED"], ["Laranja", "#F59E0B"]];

const colete = n => `<span class="colete" style="background:${COLETES[(n - 1) % COLETES.length][1]}"></span>`;
const subnavPelada = ativo => `<nav class="subnav span2 fade">${[["pelada", "Pelada"], ["times", "Times da noite"]]
  .map(([k, v]) => `<a href="#${k}" class="${k === ativo ? "on" : ""}">${v}</a>`).join("")}</nav>`;

  </div>`;

// nota de cada um pro sorteio: média dos votos das últimas 12 semanas, puxada pro pote quando há poucos votos
function notaSorteio(id){
  const m = membroDe(id), N = app.pelada.qtd_potes;
  const base = m && m.pote_manual ? 6 - (Math.min(m.pote_manual, N) - 1) * 5 / Math.max(1, N - 1) : 3.5;
  const desde = diasAtras(84);
  const r = app.medias.filter(x => x.jogador_id === id && x.data >= desde);
  const votos = r.reduce((s, x) => s + Number(x.total_votos), 0);
  const soma = r.reduce((s, x) => s + Number(x.media) * Number(x.total_votos), 0);
  const PESO_BASE = 6;   // quem tem poucos votos fica perto do pote; com muitos votos vale a média
  return (soma + PESO_BASE * base) / (votos + PESO_BASE);
}

// distribui por posição (cada time com a mesma quantidade de zagueiros, meias e atacantes)
// e depois troca jogadores da mesma posição entre times até as forças ficarem o mais parelhas possível
function sortearTimes(ids, n){
  const nota = new Map(ids.map(id => [id, notaSorteio(id)]));
  const pos = id => (membroDe(id) || {}).posicao || "LIN";
  const cap_ = Math.ceil(ids.length / n);
  const forca = t => t.reduce((s, id) => s + nota.get(id), 0);
  const custo = ts => { const f = ts.map(forca), med = f.reduce((a, b) => a + b, 0) / n; return f.reduce((s, x) => s + (x - med) ** 2, 0); };
  const tentativas = [];
  for (let k = 0; k < 120; k++) {
    const ts = Array.from({ length: n }, () => []);
    for (const p of ["ZAG", "MEI", "ATA", "LIN"]) {
      const grupo = ids.filter(id => pos(id) === p).sort((a, b) => (nota.get(b) + Math.random() * 0.6) - (nota.get(a) + Math.random() * 0.6));
      for (const id of grupo) {
        const livres = ts.filter(t => t.length < cap_);
        livres.sort((a, b) => a.filter(x => pos(x) === p).length - b.filter(x => pos(x) === p).length || a.length - b.length || forca(a) - forca(b));
        livres[0].push(id);
      }
    }
    let melhorou = true;
    while (melhorou) {
      melhorou = false;
      const atual = custo(ts);
      for (let a = 0; a < n && !melhorou; a++) for (let b = a + 1; b < n && !melhorou; b++)
        for (let i = 0; i < ts[a].length && !melhorou; i++) for (let j = 0; j < ts[b].length && !melhorou; j++) {
          if (pos(ts[a][i]) !== pos(ts[b][j])) continue;
          [ts[a][i], ts[b][j]] = [ts[b][j], ts[a][i]];
          if (custo(ts) < atual - 1e-9) melhorou = true; else [ts[a][i], ts[b][j]] = [ts[b][j], ts[a][i]];
        }
    }
    tentativas.push({ ts, c: custo(ts) });
  }
  tentativas.sort((a, b) => a.c - b.c);
  const boas = tentativas.filter(t => t.c <= tentativas[0].c + 0.05);   // entre os mais equilibrados, um ao acaso
  return boas[Math.floor(Math.random() * boas.length)].ts;
}

function timesDoJogo(){
  const m = new Map();
  app.timesJogo.forEach(t => { if (!m.has(t.time)) m.set(t.time, []); m.get(t.time).push(t.jogador_id); });
  return [...m.entries()].sort((a, b) => a[0] - b[0]);
}

/* ===================== REGISTRAR PELADA =====================
   O presidente registra a pelada depois que ela acabou: escolhe a data, separa os 4 times
   (sorteio ou na mão), registra cada partida (quem enfrentou quem) com gols e estatísticas.
   O rascunho fica no aparelho até salvar; o banco grava tudo de uma vez (salvar_pos_pelada)
   e encerra ou recalcula a rodada do Cartola. */
const POS_TIMES = [1, 2, 3, 4], TAM_TIME_POS = 6;
const letraTime = n => "ABCD"[n - 1] || "?";
const nomeTimePos = n => `Time ${letraTime(n)}`;
const seloTime = n => `<span class="selo-time">${letraTime(n)}</span>`;
const rascunhoPos = () => { try { return JSON.parse(ler("pos." + app.pelada.id) || "null"); } catch { return null; } };
const guardarPos = () => gravar("pos." + app.pelada.id, state.pos && state.pos.data ? JSON.stringify(state.pos) : null);
const timeDe = id => state.pos.times[id] || 0;
const elencoPos = n => Object.keys(state.pos.times).filter(id => state.pos.times[id] === n).sort((a, b) => nomeDe(a).localeCompare(nomeDe(b), "pt-BR"));
const timesProntos = () => POS_TIMES.every(n => elencoPos(n).length);
const contagemTimes = () => POS_TIMES.map(t => `${nomeTimePos(t)} ${elencoPos(t).length}/${TAM_TIME_POS}`).join(" · ");
const jogoAberto = () => state.pos.jogos[state.pos.aberto];
const metricaLigada = chave => app.pelada.metricas.some(m => m.chave === chave && m.ativo);
const scoutLigado = cod => app.pelada.cartola_ativo && !(app.pelada.cartola_scouts_off || []).includes(cod);
const posAssist = () => metricaLigada("assistencias") || scoutLigado("A");
const posVitoria = () => metricaLigada("vitorias") || scoutLigado("V");
// o que ele anota partida a partida: só as estatísticas ligadas na pelada (vitória e baliza zero saem do placar)
const posStats = () => opcoesLance().filter(([v]) => v !== "vitorias" && v !== "SG");
const nomeStat = k => k === "G" ? "⚽" : k === "A" ? "🎯" : k === "V" ? "Vitória" : nomeLance(k);
// quem aparece pra separar: confirmados da data, quem ele adicionou e quem já está num time
const candidatosPos = () => {
  const P = state.pos, base = P.todos ? app.membros.map(m => m.jogador_id) : [...P.confirmados, ...P.extras, ...Object.keys(P.times)];
  return [...new Set(base)].filter(membroDe).sort((a, b) => nomeDe(a).localeCompare(nomeDe(b), "pt-BR"));
};
// data da última pelada que já aconteceu (o dia da semana da pelada), pra vir sugerida
const dataSugerida = () => !app.jogo ? hoje() : app.jogo.data <= hoje() ? app.jogo.data
  : iso(new Date(new Date(app.jogo.data + "T12:00").getTime() - 7 * 864e5));

// placar sai dos gols: gol de quem é do time + gol contra do adversário
function placarPos(j){
  let a = 0, b = 0;
  j.gols.forEach(g => { if (timeDe(g.autor) === j.a) a++; else b++; });
  j.lances.filter(l => l.metrica === "gol_contra").forEach(l => { if (timeDe(l.jogador) === j.a) b += l.qtd; else a += l.qtd; });
  return [a, b];
}

function totaisPos(){
  const t = new Map();
  const soma = (id, k, n) => { if (!t.has(id)) t.set(id, {}); const o = t.get(id); o[k] = (o[k] || 0) + n; };
  state.pos.jogos.forEach(j => {
    j.gols.forEach(g => { soma(g.autor, "G", 1); if (g.assist) soma(g.assist, "A", 1); });
    j.lances.forEach(l => soma(l.jogador, l.metrica, l.qtd));
    const [a, b] = placarPos(j);
    if (posVitoria() && a !== b) elencoPos(a > b ? j.a : j.b).forEach(id => soma(id, "V", 1));
  });
  return t;
}

// times mudaram depois das partidas registradas: sai o que ficou com jogador fora dos dois times da partida
function podarJogos(){
  let fora = 0;
  state.pos.jogos.forEach(j => {
    const em = id => [j.a, j.b].includes(timeDe(id));
    const gols = j.gols.filter(g => em(g.autor));
    gols.forEach(g => { if (g.assist && timeDe(g.assist) !== timeDe(g.autor)) { g.assist = null; fora++; } });
    const lances = j.lances.filter(l => em(l.jogador));
    fora += j.gols.length - gols.length + j.lances.length - lances.length;
    Object.assign(j, { gols, lances });
  });
  return fora;
}

// mesma regra do banco (salvar_pos_pelada): o que acontece com o Cartola ao salvar
function previsaoCartola(){
  const P = state.pos, pa = app.partidas.find(x => x.data === P.data);
  if (!app.pelada.cartola_ativo) return "Os rankings são atualizados na hora. O Cartola está desligado nesta pelada.";
  const encerradas = cart().rodadas.filter(r => r.status === "encerrada");
  const usada = pa && encerradas.find(r => r.partida_id === pa.id);
  if (usada) return `Os rankings são atualizados e a <b>rodada ${usada.numero}</b> do Cartola é recalculada com os números corrigidos${usada === encerradas[encerradas.length - 1]
    ? ", inclusive os preços." : ". Os preços ficam como estão, porque já teve rodada depois dela."}`;
  const r = rodadaAberta();
  if (!r) return "Os rankings são atualizados na hora. Não tem rodada do Cartola aberta.";
  if (new Date(r.fecha_em) > new Date()) return `Os rankings são atualizados na hora. O mercado da rodada ${r.numero} do Cartola ainda está aberto, então ela não é encerrada agora.`;
  const fecha = new Date(r.fecha_em).toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
  const desde = iso(new Date(new Date(fecha + "T12:00").getTime() - 6 * 864e5));
  if ((r.partida_id && (!pa || r.partida_id !== pa.id)) || P.data < desde || P.data > hoje())
    return `Os rankings são atualizados na hora. A rodada ${r.numero} do Cartola é de outra data e não é encerrada.`;
  return `Ao salvar, a <b>rodada ${r.numero}</b> do Cartola é encerrada: pontos dos jogadores e dos times, preços e ranking da liga atualizados.`;
}

const irProRegistro = () => { if (location.hash === "#pospelada") route(); else location.hash = "pospelada"; };

// abre o registro de uma data: continua o rascunho, corrige o que já foi salvo ou começa do zero
async function abrirPos(data){
  const salvo = rascunhoPos();
  if (salvo && salvo.data === data) state.pos = salvo;
  else {
    const p = app.pelada.id, pa = app.partidas.find(x => x.data === data);
    const [lista, times, confrontos, gols, lances] = (await Promise.all([
      sb.rpc("lista_do_jogo", { p, d: data }),
      sb.from("times_do_jogo").select("jogador_id, time").eq("pelada_id", p).eq("data", data),
      sb.from("confrontos").select("id, time_a, time_b").eq("pelada_id", p).eq("data", data).order("criado_em"),
      pa ? sb.from("gols").select("confronto_id, autor_id, assistencia_id").eq("partida_id", pa.id).order("criado_em").order("id") : { data: [] },
      pa ? sb.from("lances").select("confronto_id, jogador_id, metrica, qtd").eq("partida_id", pa.id).order("id") : { data: [] }
    ])).map(ok);
    const corrigindo = !!pa && pa.modo === "pos_pelada";
    const timesSalvos = Object.fromEntries(times.filter(t => POS_TIMES.includes(t.time)).map(t => [t.jogador_id, t.time]));
    state.pos = { data, corrigindo, passo: corrigindo ? "jogos" : "times", timesOk: corrigindo, aberto: null, todos: false, extras: [], timeAtual: 1,
      modoTimes: Object.keys(timesSalvos).length ? "selecionar" : null,
      substitui: !!pa && !corrigindo && [app.gols, app.lances, app.presencas].some(xs => xs.some(x => x.partida_id === pa.id)),
      confirmados: lista.filter(l => l.situacao === "confirmado").map(l => l.jogador_id),
      times: timesSalvos,   // aproveita o sorteio do dia, se teve
      jogos: corrigindo ? confrontos.map(c => ({ a: c.time_a, b: c.time_b,
        gols: gols.filter(g => g.confronto_id === c.id && g.autor_id).map(g => ({ autor: g.autor_id, assist: g.assistencia_id })),
        lances: lances.filter(l => l.confronto_id === c.id && l.metrica !== "vitorias").map(l => ({ jogador: l.jogador_id, metrica: l.metrica, qtd: l.qtd })) })) : [] };
  }
  guardarPos();
  irProRegistro();
}

function posPassoTimes(){
  const P = state.pos, modo = P.modoTimes, ids = candidatosPos();
  const outros = app.membros.map(m => m.jogador_id).filter(id => !ids.includes(id)).sort((a, b) => nomeDe(a).localeCompare(nomeDe(b), "pt-BR"));
  const sorteados = Object.keys(P.times).length > 0;
  const adicionar = outros.length ? `<div class="row" style="margin-top:14px">
      <select class="input" id="posExtra" aria-label="Adicionar jogador"><option value="">Adicionar outro jogador</option>${outros.map(id => `<option value="${id}">${esc(nomeDe(id))}</option>`).join("")}</select>
      <button class="btn ghost" data-act="posExtra">Adicionar</button>
    </div>
    ${P.todos ? "" : `<button class="lnk" data-act="posTodos" style="margin-top:12px;background:none">Mostrar o elenco todo</button>`}` : "";
  let corpo = "";
  if (modo === "sortear") corpo = `
    <section class="card fade" style="animation-delay:.06s">
      <div class="eyebrow">Sorteio equilibrado</div><div class="h2">${plural(Math.min(ids.length, POS_TIMES.length * TAM_TIME_POS), "jogador", "jogadores")} pra sortear</div>
      <p class="note">4 times de até ${TAM_TIME_POS}, parelhos pela nota de cada um e pela posição. Pra trocar alguém depois, use <b>Selecionar jogadores</b>.</p>
      ${adicionar}
      <button class="btn ${sorteados ? "ghost " : ""}block" data-act="posSortear" ${ids.length >= POS_TIMES.length ? "" : "disabled"}>${sorteados ? "Sortear de novo" : "Sortear 4 times"}</button>
      ${sorteados ? `<div class="elencos" style="margin-top:16px">${POS_TIMES.map(n => `<div>${seloTime(n)}<span><b>${nomeTimePos(n)} (${elencoPos(n).length}):</b> ${elencoPos(n).map(id => esc(nomeDe(id))).join(", ") || "ninguém"}</span></div>`).join("")}</div>` : ""}
    </section>`;
  else if (modo === "selecionar") {
    const n = P.timeAtual || 1, elenco = elencoPos(n), cheio = elenco.length >= TAM_TIME_POS;
    const livres = ids.filter(id => !timeDe(id));
    const linha = (id, acao) => `

// estatísticas que dá pra marcar em cada jogador: gol, assistência e as ligadas na pelada
const statsJogador = () => [["G", "Gol"], ...(posAssist() ? [["A", "Assist."]] : []), ...posStats()];
function qtdStat(j, id, k){
  if (k === "G") return j.gols.filter(g => g.autor === id).length;
  if (k === "A") return j.gols.filter(g => g.assist === id).length;
  return (j.lances.find(l => l.jogador === id && l.metrica === k) || {}).qtd || 0;
}
// "Angelim ⚽2 🎯1 · Braga ⚽1": quem fez o quê na partida
function resumoJogo(j){
  const ids = [...new Set([...j.gols.flatMap(g => [g.autor, g.assist]), ...j.lances.map(l => l.jogador)].filter(Boolean))];
  return ids.map(id => `${esc(nomeDe(id))} ${statsJogador().map(([k, nome]) => [k, nome, qtdStat(j, id, k)]).filter(x => x[2])
    .map(([k, nome, q]) => k === "G" ? `⚽${q}` : k === "A" ? `🎯${q}` : `${esc(nome)} ${q}`).join(" ")}`).join(" · ");
}

function cardJogoPos(){

          <button data-act="posStat" data-id="${id}" data-k="${esc(k)}" data-d="-1" ${q ? "" : "disabled"} aria-label="Tirar ${esc(nome)} de ${esc(nomeDe(id))}">−</button>

          <button data-act="posStat" data-id="${id}" data-k="${esc(k)}" data-d="1" aria-label="${esc(nome)} de ${esc(nomeDe(id))}">+</button></div>`; }).join("")}</div>

  return `

        <div class="lado">${seloTime(j.b)}${nomeTimePos(j.b)}</div>
      </div>
      <p class="hint" style="text-align:center">Toque em + no que cada jogador fez. O placar sai dos gols${temGC ? " (gol contra conta pro adversário)" : ""}.${posAssist() ? " A assistência vai num gol de alguém do mesmo time." : ""}</p>
      ${[j.a, j.b].map(n => `
        <div class="lista-sub">${nomeTimePos(n)} <span>${plural(elencoPos(n).length, "jogador", "jogadores")}</span></div>
        <ul class="list">${elencoPos(n).map(jogador).join("")}</ul>`).join("")}
      <button class="btn block" data-act="posFechar">Partida ${i + 1} pronta</button>
    </section>`;

/* ===================== AÇÕES ===================== */
async function recarregar(){ await carregar(); route(); }
const irProJogo = () => { const el = document.getElementById("jogoAberto"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); };
async function salvarPelada(campos){
  ok(await sb.from("peladas").update(campos).eq("id", app.pelada.id));
  Object.assign(app.pelada, campos);
  const t = app.todas.find(p => p.id === app.pelada.id);
  if (t) Object.assign(t, campos);
  aviso("Salvo");
}
const linkConvite = () => `${location.origin}${location.pathname}#convite=${app.pelada.codigo_convite}`;

const ACOES = {
  login: el => { state.login = el.dataset.modo; if (el.dataset.modo === "senha") state.loginPelada = ""; renderLogin(); },
  abrir: el => run(() => abrirPelada(el.dataset.id)),
  abrirDev: el => run(async () => { location.hash = "pelada"; await abrirPelada(el.dataset.id); }),
  trocar: () => run(async () => { app.pelada = null; gravar("pelada", null); await carregarPeladas(); route(); }),
  painel: () => run(async () => { app.modoDev = true; app.pelada = null; await carregarTodas(); location.hash = "peladas"; route(); }),
  sair: () => run(async () => { ok(await sb.auth.signOut()); }),
  menuPerfil: () => { state.menuPerfil = !state.menuPerfil; renderMenuPerfil(); },
  irPara: el => { location.hash = el.dataset.hash; },
  copiar: () => run(async () => { await navigator.clipboard.writeText(linkConvite()); aviso("Link de convite copiado!"); }),
  novoCodigo: () => run(async () => {
    const c = ok(await sb.rpc("novo_codigo", { p: app.pelada.id }));
    app.pelada.codigo_convite = c;
    const t = app.todas.find(p => p.id === app.pelada.id);

    aviso(`Novo código: ${c}. O antigo parou de funcionar.`);

  }),
  copiarPres: () => run(async () => {

  }),
  novoCodigoPres: () => run(async () => {
